<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>پنل ربکا</title>
<style>
:root{
  --bg:#0c1319;--s1:#131c25;--s2:#1a2632;--line:#263644;--tx:#e7eef4;--mu:#8a9db0;
  --ac:#f0b429;--ac-ink:#1c1503;--ok:#3ecf8e;--bad:#f2706b;--info:#5aa9ff;--r:14px;
  font-family:"Vazirmatn","Vazir","IRANSansX","Segoe UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--tx);font-size:14px;line-height:1.7;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:15px;font-weight:700}
.pill{font-size:11px;padding:2px 10px;border-radius:99px;background:var(--s2);color:var(--mu)}
.pill.ok{color:var(--ok)}.pill.bad{color:var(--bad)}
main{max-width:600px;margin:0 auto;padding:14px 14px 24px}
nav{position:fixed;inset:auto 0 0 0;z-index:6;background:var(--s1);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:11px;padding:6px 0;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:0}
nav button b{font-size:18px;font-weight:400;line-height:1.3}
nav button.on{color:var(--ac);background:var(--s2)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--tx)}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;padding:10px 12px;min-height:44px}
input:focus,select:focus{border-color:var(--ac);outline:0}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--ac)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--tx);font-size:13px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:44px;padding:0 16px;border-radius:10px;border:1px solid var(--line);
  background:var(--s2);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;width:100%}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--ac-ink)}
.btn.bad{color:var(--bad)}.btn.sm{min-height:36px;padding:0 12px;font-size:12px;width:auto}
.btn:disabled{opacity:.5;cursor:wait}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1}
.hint{font-size:12px;color:var(--mu);margin-top:8px}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat span{font-size:12px;color:var(--mu)}.stat strong{display:block;font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.item{border:1px solid var(--line);background:var(--s1);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.item>summary,.item>.head{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer;min-height:48px}
.item>summary::-webkit-details-marker{display:none}
.item .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.nm{font-weight:700;word-break:break-all}.sub{font-size:12px;color:var(--mu)}
code,.code{display:block;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);
  border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:10px 0;word-break:break-all;cursor:copy}
.bar{height:6px;background:var(--bg);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--mu);border-radius:99px;padding:4px 12px;font:inherit;font-size:12px;cursor:pointer}
.chip.on{color:var(--ac-ink);background:var(--ac);border-color:var(--ac)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:6px;background:var(--mu)}
.s-active .dot{background:var(--ok)}.s-on_hold .dot{background:var(--info)}.s-expired .dot,.s-limited .dot{background:var(--bad)}
img.qr{display:block;margin:10px auto;width:220px;max-width:100%;border-radius:10px;background:#fff;padding:6px}
.err{color:var(--bad);font-size:12px;margin-top:6px}
.toast{position:fixed;inset:auto 16px calc(90px + env(safe-area-inset-bottom)) 16px;z-index:9;margin:auto;max-width:420px;background:var(--s2);border:1px solid var(--line);
  border-radius:12px;padding:10px 14px;text-align:center;box-shadow:0 8px 30px #0008}
.toast.bad{border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<header><h1>پنل مدیریت ربکا</h1><div style="display:flex;gap:8px;align-items:center"><select id="psel" hidden aria-label="پنل فعال" style="min-height:34px;padding:2px 10px;width:auto;max-width:150px;font-size:12px"></select><span id="conn" class="pill">…</span></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'value') n.value = v;
    else if (k === 'checked') n.checked = !!v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
async function api(path, method = 'GET', body) {
  let r;
  if (S.panel && !/^\/(state|templates|panels|qr)/.test(path) && path !== '/settings') path += (path.includes('?') ? '&' : '?') + 'panel=' + encodeURIComponent(S.panel);
  try {
    r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'rebecca' }, body: body ? JSON.stringify(body) : undefined });
  } catch { throw new Error('ارتباط با سرور برقرار نشد.'); }
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : (Array.isArray(d.detail) ? 'ورودی نامعتبر است.' : 'خطا ' + r.status));
  return d;
}
let tt;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const a = h('textarea', { value: text, style: 'position:fixed;opacity:0' }); document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('کپی شد');
}
const gb = b => !b ? 'نامحدود' : (b / 1073741824).toFixed(2) + ' GB';
function toggleQR(box, sub, name) {
  if (box.firstChild) return box.replaceChildren();
  box.replaceChildren(h('img', { class: 'qr', loading: 'lazy', alt: 'QR ' + name, src: '/api/qr?text=' + encodeURIComponent(sub) }));
}
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
async function run(btn, fn) {
  const old = btn.textContent; btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; btn.textContent = old; }
}

const S = { st: null, panel: null, tab: 'create', users: { q: '', status: '', off: 0 }, last: null };
const TABS = [['create', '➕', 'ساخت'], ['users', '👥', 'کاربران'], ['home', '📊', 'خانه'], ['tpl', '⚙️', 'تمپلت'], ['set', '🔧', 'تنظیمات']];

function renderNav() {
  const nav = $('#nav'); nav.replaceChildren(...TABS.map(([k, ic, t]) =>
    h('button', { class: S.tab === k ? 'on' : '', onclick: () => go(k), 'aria-label': t }, h('b', {}, ic), t)));
}
async function go(tab) { S.tab = tab; renderNav(); await ({ create: vCreate, users: vUsers, home: vHome, tpl: vTpl, set: vSet })[tab](); window.scrollTo(0, 0); }
const hasPanel = () => S.st.panels.some(p => p.ok);
async function refreshState() {
  S.st = await api('/state');
  let saved = null; try { saved = localStorage.getItem('rb.panel'); } catch {}
  if (!S.st.panels.some(p => p.id === S.panel)) S.panel = S.st.panels.some(p => p.id === saved) ? saved : S.st.active_panel;
  const sel = $('#psel'); sel.hidden = S.st.panels.length < 2;
  sel.replaceChildren(...S.st.panels.map(p => h('option', { value: p.id, selected: p.id === S.panel }, p.name)));
  sel.onchange = () => setPanel(sel.value);
  const cur = S.st.panels.find(p => p.id === S.panel), c = $('#conn');
  c.textContent = !S.st.panels.length ? 'پنل ندارید' : (cur && cur.ok ? 'متصل' : 'ناقص'); c.className = 'pill ' + (cur && cur.ok ? 'ok' : 'bad');
}
async function setPanel(id) {
  S.panel = id; S.users.off = 0; try { localStorage.setItem('rb.panel', id); } catch {}
  $('#psel').value = id; await go(S.tab);
}
const mount = (...n) => $('#view').replaceChildren(...n);
const field = (label, input) => h('div', {}, h('label', {}, label), input);

/* ───────── ساخت ───────── */
async function vCreate() {
  const st = S.st;
  if (!hasPanel()) return mount(h('div', { class: 'card' }, h('h2', {}, 'اتصال به پنل'), h('p', { class: 'hint' }, 'ابتدا از تب «تنظیمات» یک پنل ربکا اضافه کنید.'), h('div', { class: 'btns' }, h('button', { class: 'btn pri', onclick: () => go('set') }, 'رفتن به تنظیمات'))));
  let services = [];
  try { services = (await api('/services')).services; } catch (e) { toast(e.message, true); }
  const psel = h('select', {}, st.panels.map(p => h('option', { value: p.id, selected: p.id === S.panel }, p.name + (p.ok ? '' : ' (ناقص)'))));
  psel.onchange = () => setPanel(psel.value);
  const tpl = h('select', {}, Object.entries(st.templates).map(([n, t]) => h('option', { value: n, selected: n === st.active }, `${n} — ${t.gb || '∞'}GB / ${t.days || '∞'}d`)));
  const ltr = { autocapitalize: 'none', autocomplete: 'off', dir: 'ltr', maxlength: 32 };
  const base = h('input', { ...ltr, value: st.default_prefix, placeholder: 'MS_' });
  const start = h('input', { type: 'number', inputmode: 'numeric', min: 0, dir: 'ltr', placeholder: '…' });
  const count = h('input', { type: 'number', inputmode: 'numeric', min: 1, max: st.max_batch, value: 1, dir: 'ltr' });
  const one = h('input', { ...ltr, placeholder: 'MS_150' });             // حالت تکی: نام کامل
  const cg = h('input', { type: 'number', min: 0, step: 'any', dir: 'ltr', placeholder: 'GB (0=∞)' });
  const cd = h('input', { type: 'number', min: 0, dir: 'ltr', placeholder: 'روز (0=∞)' });
  const cm = h('select', {}, h('option', { value: 'on_hold' }, '⏳ از اولین اتصال (On-Hold)'), h('option', { value: 'active' }, '▶️ از همین حالا (Active)'));
  const fillTpl = () => { const t = st.templates[tpl.value]; if (t) { cg.value = t.gb; cd.value = t.days; cm.value = t.mode; } };
  tpl.addEventListener('change', fillTpl); fillTpl();
  const svc = h('select', {}, services.map(s => h('option', { value: s.id }, s.name)));
  // تکی ← ms ، گروهی ← hamkari (اگر کاربر دستی عوض کند، دیگر خودکار تغییر نمی‌کند)
  const hamNames = (st.ham_names && st.ham_names.length ? st.ham_names : ['hamkari']).map(x => x.toLowerCase());
  const isHam = s => hamNames.some(n => n && s.name.toLowerCase().includes(n));
  const autoSvc = m => {
    const c = m === 'group' ? services.find(isHam) : (services.find(s => !isHam(s) && s.name.trim().toLowerCase() === 'ms') || services.find(s => !isHam(s) && /(^|[^a-z0-9])ms([^a-z0-9]|$)/i.test(s.name)));
    if (c) svc.value = c.id;
  };
  let svcTouched = false; svc.addEventListener('change', () => { svcTouched = true; });
  const tg = h('input', { type: 'checkbox', id: 'tg', checked: st.bot });
  const prev = h('p', { class: 'hint' }), last = h('p', { class: 'hint' });
  const out = h('div');
  let mode = S.cmode || 'group';
  const chipS = h('button', { class: 'chip', type: 'button' }, '👤 تکی'), chipG = h('button', { class: 'chip', type: 'button' }, '👥 گروهی');
  const grpBox = h('div', {}, field('پیشوند نام کاربری', base), h('div', { class: 'row' }, field('عدد شروع (خودکار)', start), field('تعداد', count)));
  const oneBox = h('div', {}, field('نام کاربری', one));
  const gdBox = h('div', { class: 'row' }, field('حجم (GB)', cg), field('مدت (روز)', cd));
  const modeBox = h('div', {}, field('شروع اعتبار (اولین اتصال)', cm));
  const upd = () => {
    chipS.className = 'chip' + (mode === 'single' ? ' on' : ''); chipG.className = 'chip' + (mode === 'group' ? ' on' : '');
    grpBox.hidden = mode === 'single'; oneBox.hidden = gdBox.hidden = modeBox.hidden = mode !== 'single';
    const n = Math.max(1, +count.value || 1), b = base.value.trim(), s = start.value.trim();
    prev.textContent = mode === 'single' ? (one.value.trim() ? `ساخته می‌شود: ${one.value.trim()}` : '')
      : (!b || s === '' ? '' : (n === 1 ? `ساخته می‌شود: ${b}${s}` : `ساخته می‌شود: ${b}${s} … ${b}${+s + n - 1}  (${n} کاربر)`));
  };
  // تشخیص خودکار آخرین نام‌کاربری و شماره‌ی بعدی
  let seq = 0;
  const detect = async (prefix, fillOne) => {
    const my = ++seq; last.textContent = 'در حال بررسی آخرین کاربر…';
    try {
      const r = await api('/next-name?prefix=' + encodeURIComponent(prefix));
      if (my !== seq) return;
      start.value = r.next; if (r.prefix.toLowerCase() === base.value.trim().toLowerCase()) base.value = r.prefix;
      if (fillOne || !one.value) one.value = r.prefix + r.next;
      last.textContent = r.last ? `آخرین کاربر: ${r.last} ← شماره‌ی بعدی: ${r.next}` + (r.max ? ` (⚠️ بالاترین عدد موجود: ${r.max})` : '') : `هنوز کاربری با «${r.prefix}» نیست ← شروع از ${r.next}`;
    } catch (e) { if (my === seq) last.textContent = 'تشخیص خودکار ممکن نشد: ' + e.message; }
    upd();
  };
  chipS.onclick = () => { mode = S.cmode = 'single'; if (!svcTouched) autoSvc(mode); upd(); }; chipG.onclick = () => { mode = S.cmode = 'group'; if (!svcTouched) autoSvc(mode); upd(); };
  base.addEventListener('input', debounce(() => { upd(); if (/^[A-Za-z0-9_]{1,28}$/.test(base.value.trim())) detect(base.value.trim(), true); }, 450));
  [start, count, one].forEach(i => i.addEventListener('input', upd)); autoSvc(mode); upd(); detect(st.default_prefix, true);
  const go_ = h('button', { class: 'btn pri' }, '⚡ ساخت اکانت');
  go_.onclick = () => run(go_, async () => {
    if (!svc.value) throw new Error('سرویسی برای این پنل پیدا نشد؛ اتصال پنل را در تنظیمات بررسی کنید.');
    let body;
    if (mode === 'single') { if (!one.value.trim()) throw new Error('نام کاربری را وارد کنید.'); if (cg.value === '' || cd.value === '' || +cg.value < 0 || +cd.value < 0) throw new Error('حجم و مدت را وارد کنید (۰ = نامحدود).'); body = { base: one.value.trim(), start: null, count: 1, gb: +cg.value, days: +cd.value, mode: cm.value }; }
    else { if (!base.value.trim() || start.value === '') throw new Error('پیشوند و عدد شروع را وارد کنید.'); body = { base: base.value.trim(), start: +start.value, count: Math.max(1, +count.value || 1) }; }
    go_.textContent = 'در حال ساخت…';
    const r = await api('/create', 'POST', { ...body, service_id: +svc.value, template: tpl.value, telegram: tg.checked });
    r.panelName = (st.panels.find(p => p.id === S.panel) || {}).name; S.last = r; showResults(out, r);
    if (r.telegram === 'queued') toast('QRها به تلگرام ادمین ارسال می‌شوند'); else if (r.telegram === 'no_bot') toast('ربات/ادمین تنظیم نشده؛ ارسال تلگرام انجام نشد', true);
    detect(mode === 'single' ? st.default_prefix : base.value.trim(), mode === 'single');   // شماره‌ی بعدی برای ساخت بعدی
  });
  mount(h('div', { class: 'card' }, h('h2', {}, 'ساخت اکانت'),
    h('div', { class: 'chips', style: 'padding-bottom:6px' }, chipS, chipG),
    st.panels.length > 1 ? field('ساخت روی پنل', psel) : null, field('تمپلت', tpl), grpBox, oneBox, gdBox, last, prev,
    field('سرویس', svc), modeBox,
    st.bot ? h('label', { class: 'chk', for: 'tg' }, tg, 'ارسال QR و لینک‌ها به تلگرام ادمین') : null,
    h('div', { class: 'btns' }, go_)), out);
  if (S.last) showResults(out, S.last);
}
function showResults(box, r) {
  const links = r.ok.map(u => `${u.username} | ${u.sub}`).join('\n');
  box.replaceChildren(
    h('div', { class: 'card' }, h('h2', {}, `✅ ${r.ok.length} اکانت ساخته شد` + (r.panelName && S.st.panels.length > 1 ? ` روی «${r.panelName}»` : '') + (r.failed.length ? ` — ⚠️ ${r.failed.length} ناموفق` : '')),
      r.value ? h('p', { class: 'hint' }, `💰 ارزش فروش این ساخت: ${r.value.toLocaleString('fa-IR')} تومان`) : null,
      r.failed.slice(0, 20).map(f => h('p', { class: 'err' }, `${f.username}: ${f.reason}`)),
      r.ok.length ? h('div', { class: 'btns' },
        h('button', { class: 'btn', onclick: () => copy(r.ok.map(u => u.sub).join('\n')) }, '📋 کپی همه لینک‌ها'),
        h('button', { class: 'btn', onclick: () => { const a = h('a', { href: URL.createObjectURL(new Blob([links], { type: 'text/plain' })), download: `${r.ok[0].username}_subs.txt` }); a.click(); } }, '💾 دانلود txt')) : null),
    r.ok.map(u => {
      const q = h('div');
      return h('div', { class: 'item' }, h('div', { class: 'body', style: 'border:0;padding-top:12px' },
        h('div', { class: 'nm' }, u.username), h('code', { onclick: () => copy(u.sub) }, u.sub || '—'), q,
        h('div', { class: 'btns', style: 'margin-top:0' },
          h('button', { class: 'btn sm', onclick: () => toggleQR(q, u.sub, u.username) }, '🖼 QR'),
          h('button', { class: 'btn sm', onclick: () => copy(u.sub) }, '📋 کپی'))));
    }));
}

/* ───────── کاربران ───────── */
async function vUsers() {
  if (!hasPanel()) return vCreate();
  const U = S.users; const list = h('div'); const more = h('button', { class: 'btn', hidden: true }, 'بیشتر'); const info = h('p', { class: 'hint' });
  const search = h('input', { type: 'search', placeholder: 'جستجوی نام کاربری…', value: U.q, dir: 'ltr', autocomplete: 'off' });
  const chips = h('div', { class: 'chips' }, [['', 'همه'], ['active', 'فعال'], ['on_hold', 'On-Hold'], ['expired', 'منقضی'], ['limited', 'محدود'], ['disabled', 'غیرفعال']].map(([k, t]) =>
    h('button', { class: 'chip' + (U.status === k ? ' on' : ''), onclick: () => { U.status = k; vUsers(); } }, t)));
  async function load(reset) {
    if (reset) { U.off = 0; list.replaceChildren(); }
    try {
      const r = await api(`/users?offset=${U.off}&limit=20&search=${encodeURIComponent(U.q)}&status=${U.status}`);
      r.users.forEach(u => list.append(userItem(u, list)));
      U.off += r.users.length; more.hidden = U.off >= r.total; info.textContent = r.total ? `${r.total} کاربر` : 'کاربری پیدا نشد.';
    } catch (e) { info.textContent = e.message; info.className = 'err'; }

  search.addEventListener('input', debounce(() => { U.q = search.value.trim(); load(true); }, 350));

    S.panel = r.id; await refreshState();
    try { const t = await api('/settings/test', 'POST'); toast(`✅ متصل شد · ${t.total_user} کاربر · ${t.services} سرویس`); }
    catch (e) { toast('ذخیره شد ولی اتصال ناموفق: ' + e.message, true); }
    await vSet();
  });
  const list = c.panels.map(p => {
    const on = p.id === c.active_panel;
    const mk = (label, fn, cls = '') => { const b = h('button', { class: 'btn sm ' + cls }, label); b.onclick = () => run(b, fn); return b; };
    return h('div', { class: 'item', style: on ? 'border-color:var(--ac)' : '' }, h('div', { class: 'head' }, h('span', { class: 'nm' }, (on ? '✅ ' : '🖥 ') + p.name), h('span', { class: 'sub', dir: 'ltr' }, p.panel_url.replace(/^https?:\/\//, ''))),
      h('div', { class: 'body' }, h('div', { class: 'btns' },
        on ? null : mk('فعال‌سازی', async () => { await api('/panels/active', 'POST', { name: p.id }); await refresh(); }),
        mk('✏️ ویرایش', async () => { fill(p); saveP.scrollIntoView({ behavior: 'smooth' }); }),
        mk('🔌 تست', async () => { S.panel = p.id; const t = await api('/settings/test', 'POST'); toast(`✅ ${t.total_user} کاربر · ${t.services} سرویس`); await refreshState(); }),
        mk('🗑 حذف', async () => { if (!confirm(`پنل «${p.name}» از ربات حذف شود؟ (کاربران داخل پنل دست نمی‌خورند)`)) return; await api('/panels/delete', 'POST', { name: p.id }); await refresh(); }, 'bad'))));
  });
  const tok = i(c.bot_token, '123456:ABC…'), adm = i(c.admin_ids.join(', '), 'شناسه عددی ادمین‌ها، با کاما'), wp = i('', 'حداقل ۸ کاراکتر', 'password');
  const saveB = h('button', { class: 'btn pri' }, 'ذخیره تنظیمات ربات');
  saveB.onclick = () => run(saveB, async () => { const r = await api('/settings', 'POST', { bot_token: tok.value, admin_ids: adm.value }); toast(r.bot_restarted ? 'ذخیره شد و ربات ریستارت شد' : 'ذخیره شد'); await refreshState(); });
  const saveW = h('button', { class: 'btn' }, 'تغییر رمز وب‌پنل');
  saveW.onclick = () => run(saveW, async () => { await api('/settings', 'POST', { web_password: wp.value }); toast('رمز تغییر کرد؛ دوباره وارد شوید'); setTimeout(() => location.reload(), 1200); });
  // قیمت‌ها و لیست فروش
  let sc = null; try { sc = await api('/sales/settings'); } catch (e) { sc = null; }
  let priceCard = h('div', { class: 'card' }, h('h2', {}, '💰 قیمت‌ها'), h('p', { class: 'err' }, 'خطا در دریافت تنظیمات فروش'));
  if (sc) {
    const ham = i(sc.hamkari_per_gb, '3000', 'number'), buy = i(sc.buy_per_tb, '750000', 'number'), mul = i(sc.hamkari_usage_multiplier, '1.5', 'number');
    const svc = i(sc.hamkari_service_names, 'hamkari'), ign = i(sc.ignore_service_names, 'tes, test');
    const rows = h('div', {});
    const fa = n => (+n || 0).toLocaleString('fa-IR');
    const addRow = p => {
      const g = i(p.gb, 'گیگ', 'number'), m = i(p.months, 'ماه', 'number'), pr = i(p.price, 'تومان', 'number');
      const per = h('span', { class: 'sub', style: 'min-width:64px;text-align:center' });
      const calc = () => { per.textContent = +g.value > 0 && +pr.value > 0 ? fa(Math.round(pr.value / g.value)) + '/GB' : ''; };
      [g, m, pr].forEach(x => x.addEventListener('input', calc)); calc();
      const del = h('button', { class: 'btn sm bad', type: 'button', style: 'flex:none' }, '🗑');
      const row = h('div', { style: 'display:grid;grid-template-columns:1fr 0.7fr 1.4fr auto auto;gap:6px;align-items:center;margin-bottom:6px' }, g, m, pr, per, del); row._f = { g, m, pr };
      del.onclick = () => row.remove(); rows.append(row);
    };
    const head = h('div', { class: 'sub', style: 'display:grid;grid-template-columns:1fr 0.7fr 1.4fr auto auto;gap:6px;margin:6px 0' }, h('span', {}, 'حجم GB'), h('span', {}, 'ماه'), h('span', {}, 'قیمت (تومان)'), h('span', { style: 'min-width:64px;text-align:center' }, 'گیگی'), h('span', { style: 'width:36px' }));
    sc.single_prices.forEach(addRow);
    const addB = h('button', { class: 'btn sm', type: 'button' }, '➕ پلن جدید'); addB.onclick = () => addRow({ gb: '', months: 1, price: '' });
    const saveS = h('button', { class: 'btn pri' }, 'ذخیره قیمت‌ها');
    saveS.onclick = () => run(saveS, async () => {
      const single_prices = [...rows.children].map(r => ({ gb: +r._f.g.value, months: +r._f.m.value, price: +r._f.pr.value })).filter(p => p.gb > 0 && p.months > 0);
      await api('/sales/settings', 'POST', { hamkari_per_gb: +ham.value, buy_per_tb: +buy.value, hamkari_usage_multiplier: +mul.value, hamkari_service_names: svc.value, ignore_service_names: ign.value, single_prices });
      toast('✅ قیمت‌ها ذخیره شد (از گزارش بعدی اعمال می‌شود)'); vSet();
    });
    priceCard = h('div', { class: 'card' }, h('h2', {}, '💰 قیمت‌ها و لیست فروش'),
      h('div', { class: 'row' }, field('هر گیگ همکاری (تومان)', ham), field('نام سرویس همکاری', svc)),
      h('h2', { style: 'font-size:13px;margin:12px 0 0' }, '👤 لیست فروش تکی (MS)'), head, rows,
      h('p', { class: 'hint' }, `حجم‌های خارج از لیست روی سرویس MS به‌نرخ گیگی ${fa(sc.fallback_rate)} تومان (از پلن ۳۰ گیگ یک‌ماهه) حساب می‌شود.`),
      h('div', { class: 'btns', style: 'margin-top:6px' }, addB),
      h('h2', { style: 'font-size:13px;margin:14px 0 6px' }, '🧾 هزینه و سرویس‌ها'),
      h('div', { class: 'row' }, field('خرید هر ترابایت', buy), field('ضریب مصرف همکاری', mul)),
      field('سرویس‌های نادیده (تست؛ با کاما)', ign), h('div', { class: 'btns' }, saveS));
  }
  // بکاپ و بازیابی
  const autoB = h('input', { type: 'checkbox', id: 'autob', checked: c.backup_enabled });
  autoB.onchange = () => api('/backup/settings', 'POST', { enabled: autoB.checked }).then(() => toast(autoB.checked ? 'بکاپ شبانه روشن شد' : 'بکاپ شبانه خاموش شد')).catch(e => { autoB.checked = !autoB.checked; toast(e.message, true); });
  const dlB = h('button', { class: 'btn', type: 'button' }, '⬇️ دانلود بکاپ'); dlB.onclick = () => { location.href = '/api/backup'; };
  const tgB = h('button', { class: 'btn', type: 'button' }, '📤 ارسال بکاپ به تلگرام'); tgB.onclick = () => run(tgB, async () => { await api('/backup/send', 'POST'); toast('✅ بکاپ به تلگرام ارسال شد'); });
  const fileI = h('input', { type: 'file', accept: '.json,application/json' });
  const rsB = h('button', { class: 'btn bad', type: 'button' }, '♻️ بازیابی از فایل');
  rsB.onclick = () => run(rsB, async () => {
    const f = fileI.files[0]; if (!f) throw new Error('ابتدا فایل بکاپ را انتخاب کنید.');
    if (f.size > 2e6) throw new Error('حجم فایل زیاد است.');
    if (!confirm('همه‌ی تنظیمات فعلی (پنل‌ها، توکن، قیمت‌ها، دیتابیس) با این فایل جایگزین شود؟\nاز وضعیت فعلی یک نسخه‌ی پشتیبان روی سرور ذخیره می‌شود.')) return;
    const r = await api('/backup/restore', 'POST', { content: await f.text() });
    toast(`✅ بازیابی شد (${r.panels} پنل) · ربات در حال ریستارت`);
    setTimeout(() => location.reload(), r.web_changed ? 1800 : 1200);
  });
  const backupCard = h('div', { class: 'card' }, h('h2', {}, '💾 بکاپ و بازیابی'),
    h('label', { class: 'chk', for: 'autob' }, autoB, 'ارسال خودکار بکاپ هر شب ساعت ۰۰:۰۰ همراه گزارش فروش'),
    h('div', { class: 'btns' }, dlB, tgB),
    h('h2', { style: 'font-size:13px;margin:14px 0 6px' }, 'بازیابی از فایل بکاپ'), fileI,
    h('p', { class: 'hint' }, 'فایل بکاپ شامل توکن و رمزهاست. بعد از بازیابی ربات خودکار ریستارت می‌شود. اگر رمز وب‌پنل در فایل متفاوت باشد، باید با رمز آن فایل دوباره وارد شوید.'),
    h('div', { class: 'btns' }, rsB));
  mount(
    priceCard, backupCard,
    h('h2', { style: 'font-size:13px;margin:0 2px 8px' }, `پنل‌های ربکا (${c.panels.length})`), ...list,
    h('div', { class: 'card' }, ptitle, field('نام پنل', nm), field('آدرس پنل', url), field('دامنه سابسکریپشن', sub), field('نام کاربری ادمین', user), field('رمز عبور', pass),
      h('label', { class: 'chk', for: 'ssl' }, ssl, 'بررسی گواهی SSL (برای گواهی خودامضا خاموش بماند)'),
      h('div', { class: 'btns' }, saveP, h('button', { class: 'btn', onclick: () => fill(null) }, 'فرم خالی (پنل جدید)'))),
    h('div', { class: 'card' }, h('h2', {}, 'ربات تلگرام'), field('توکن ربات', tok), field('شناسه ادمین‌ها', adm), h('p', { class: 'hint' }, 'شناسه عددی را از ربات‌هایی مثل @userinfobot بگیرید.'), h('div', { class: 'btns' }, saveB)),
    h('div', { class: 'card' }, h('h2', {}, `رمز وب‌پنل (کاربر: ${c.web_user})`), field('رمز جدید', wp), h('div', { class: 'btns' }, saveW)));
}

(async () => {
  renderNav();
  try { await refreshState(); await go(hasPanel() ? 'create' : 'set'); }
  catch (e) { mount(h('div', { class: 'card' }, h('p', { class: 'err' }, e.message))); }
})();
</script>
</body>
</html>
