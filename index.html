<style>
:root{
  --bg:#080c14;--s1:#0f1622;--s2:#182130;--line:#222d3d;--tx:#e9f0f6;--mu:#8497aa;
  --ac:#8b7cff;--ac2:#4cc2ff;--ac-ink:#0b0b1f;--ok:#3ecf8e;--bad:#f2706b;--warn:#f5a524;--info:#5aa9ff;--r:20px;
  --shadow:0 8px 28px #0007;
    --font:"Vazirmatn","Vazir","IRANSansX","Segoe UI",Tahoma,"Noto Sans Arabic","Noto Naskh Arabic",system-ui,sans-serif;
  --fs-xs:11.5px;--fs-sm:13px;--fs-md:14px;--fs-lg:16px;--fs-xl:21px;--fs-2xl:28px;--fs-3xl:32px;   /* مقیاس تایپوگرافی (موبایل) */
  --fw-regular:400;--fw-medium:500;--fw-semibold:600;--fw-bold:700;--fw-heavy:800;
  font-family:var(--font);
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;font-family:var(--font)}
button,input,select,textarea{font-family:inherit}
body{background:radial-gradient(900px 420px at 90% -140px,color-mix(in srgb,var(--ac) 12%,transparent),transparent 60%),radial-gradient(700px 380px at -10% 8%,#5aa9ff12,transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--tx);font-size:var(--fs-md);line-height:1.7;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:var(--fs-md);font-weight:800;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:var(--fs-lg);color:var(--ac-ink);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 33%,transparent)}
.pill{font-size:var(--fs-xs);padding:3px 11px;border-radius:99px;background:var(--s2);color:var(--mu);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#3ecf8e55;background:#3ecf8e14}.pill.bad{color:var(--bad);border-color:#f2706b55;background:#f2706b14}
main{max-width:600px;margin:0 auto;padding:14px 14px 24px}
nav{position:fixed;inset:auto 10px calc(10px + env(safe-area-inset-bottom)) 10px;z-index:6;max-width:580px;margin:0 auto;background:color-mix(in srgb,var(--s1) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px}
nav button{position:relative;background:none;border:0;color:var(--mu);font:inherit;font-size:var(--fs-xs);font-weight:600;padding:7px 0 6px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s,background .15s}
nav button svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
nav button.on{color:var(--ac);background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 17%,transparent),color-mix(in srgb,var(--ac) 6%,transparent))}
nav button.on svg{transform:translateY(-1px) scale(1.08)}
nav button.on::after{content:"";position:absolute;bottom:2px;width:16px;height:3px;border-radius:3px;background:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:linear-gradient(180deg,var(--s1),var(--s0));border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0004}
.card h2{font-size:var(--fs-sm);font-weight:800;margin-bottom:12px;color:var(--tx);display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:15px;border-radius:4px;background:linear-gradient(180deg,var(--ac),var(--ac2));flex:none}
label{display:block;font-size:var(--fs-sm);color:var(--mu);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;padding:10px 12px;min-height:46px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 15%,transparent);outline:0}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--ac)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--tx);font-size:var(--fs-sm)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--s2);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;width:100%;transition:transform .08s,filter .15s,border-color .15s}
.btn:hover{border-color:#3a5166}.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:var(--ac-ink);box-shadow:0 4px 16px color-mix(in srgb,var(--ac) 25%,transparent)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad)}.btn.sm{min-height:36px;padding:0 12px;font-size:var(--fs-sm);width:auto}
.btn:disabled{opacity:.5;cursor:wait}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1;white-space:nowrap}
.hint{font-size:var(--fs-sm);color:var(--mu);margin-top:8px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sec h2{font-size:var(--fs-md);font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:16px;border-radius:4px;background:linear-gradient(180deg,var(--ac),var(--ac2))}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--s1),var(--s0));border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 8px}
.stat div::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--line));opacity:.9}
.stat div::after{content:"";position:absolute;inset-inline-end:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--c,transparent);opacity:.09}
.stat span{font-size:var(--fs-xs);color:var(--mu);white-space:nowrap}
.stat strong{display:block;font-size:var(--fs-xl);font-weight:800;font-variant-numeric:tabular-nums;color:var(--c,var(--tx));line-height:1.3;unicode-bidi:isolate}
.stat div.wide{grid-column:1/-1;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.stat div.wide strong{font-size:var(--fs-2xl)}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 18%,transparent),color-mix(in srgb,var(--ac2) 8%,transparent) 55%,transparent),var(--s1);border:1px solid color-mix(in srgb,var(--ac) 28%,transparent);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset-inline-start:-40px;bottom:-60px;width:160px;height:160px;border-radius:50%;background:var(--ac);opacity:.07}
.hero .lb{font-size:var(--fs-sm);color:var(--mu)}
.hero .big{font-size:var(--fs-3xl);font-weight:800;font-variant-numeric:tabular-nums;line-height:1.35;unicode-bidi:isolate}
.hero .big small{font-size:var(--fs-sm);color:var(--mu);font-weight:500;margin-inline-start:6px}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;position:relative;z-index:1}
.hero .mini div{background:#0a101699;border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.hero .mini span{display:block;font-size:var(--fs-xs);color:var(--mu)}
.hero .mini strong{font-size:var(--fs-md);font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.bw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.bw div{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:var(--fs-sm);color:var(--mu)}
.bw b{font-size:var(--fs-lg);font-variant-numeric:tabular-nums;direction:ltr}
.bw .d b{color:var(--info)}.bw .u b{color:var(--ok)}
.item{border:1px solid var(--line);background:linear-gradient(180deg,var(--s1),var(--s0));border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.item:hover{border-color:#34495b}
.item>summary,.item>.head{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer;min-height:50px}
.item>summary::-webkit-details-marker{display:none}
.item>summary .nm{flex:1;min-width:0}.item>summary .sub{flex:none}
.item>summary::after{content:"";flex:none;width:7px;height:7px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;margin-inline-start:4px}
.item[open]>summary::after{transform:rotate(-135deg)}
.item[open]{border-color:#3a5166}
.item .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.nm{font-weight:700;word-break:break-all}.sub{font-size:var(--fs-sm);color:var(--mu)}
code,.code{display:block;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:var(--fs-sm);background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:10px 0;word-break:break-all;cursor:copy}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),#7be3b3);transition:width .5s}
.bar i.w{background:linear-gradient(90deg,var(--warn),#ffd079)}.bar i.b{background:linear-gradient(90deg,var(--bad),#ff9d99)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--mu);border-radius:99px;padding:5px 14px;font:inherit;font-size:var(--fs-sm);font-weight:600;cursor:pointer;transition:all .15s}
.chip:hover{border-color:#3a5166;color:var(--tx)}
.chip.on{color:var(--ac-ink);background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:6px;background:var(--mu)}
.s-active .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}.s-on_hold .dot{background:var(--warn)}.s-expired .dot,.s-limited .dot{background:var(--bad)}
.rnote{display:block;font-size:var(--fs-sm);color:var(--ac);margin-top:2px;word-break:break-word}
.tag.paid{color:var(--ok);border-color:#3ecf8e55;background:#3ecf8e14}.paidchk{margin:8px 0 0;font-size:var(--fs-sm)}
.notebox{display:flex;gap:6px;margin:10px 0 0}.notebox .noteIn{flex:1;min-width:0}
.shareapps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.shareapps .btn{text-align:center;text-decoration:none}
img.qr{display:block;margin:10px auto;width:220px;max-width:100%;border-radius:14px;background:#fff;padding:8px}
.err{color:var(--bad);font-size:var(--fs-sm);margin-top:6px}
.menubtn{background:none;border:1px solid var(--line);color:var(--tx);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.menubtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.scrim{position:fixed;inset:0;background:#000a;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(300px,84vw);z-index:21;background:linear-gradient(180deg,var(--s1),#0c141c);border-inline-end:1px solid var(--line);box-shadow:var(--shadow);
  transform:translateX(105%);transition:transform .25s;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;overflow:auto}
.drawer.on{transform:none}
.drawer .who{font-weight:800;font-size:var(--fs-md)}.drawer .bal{margin:10px 0 8px;padding:12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--ac) 33%,transparent);background:color-mix(in srgb,var(--ac) 10%,transparent)}
.drawer .bal span{display:block;font-size:var(--fs-xs);color:var(--mu)}.drawer .bal b{font-size:var(--fs-xl);color:var(--ac)}
.drawer .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;color:var(--tx);font:inherit;font-size:var(--fs-md);font-weight:600;padding:12px;border-radius:12px;cursor:pointer}
.drawer .mi:hover,.drawer .mi.on{background:var(--s2)}.drawer .mi.on{color:var(--ac)}.drawer .sp{flex:1}
.bigbal{text-align:center;padding:18px 12px}.bigbal span{font-size:var(--fs-sm);color:var(--mu)}.bigbal b{display:block;font-size:var(--fs-2xl);color:var(--ac);margin-top:2px}
.tplopt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--bg)}
.tplopt.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 10%,transparent)}.tplopt input{width:auto;min-height:0}.tplopt .tn{flex:1;min-width:0;font-weight:700}.tplopt .tp{font-size:var(--fs-sm);color:var(--mu)}.tplopt b{color:var(--ac);white-space:nowrap}
.lg{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:var(--fs-sm)}.lg:last-child{border:0}.lg .pos{color:var(--ok)}.lg .neg{color:var(--bad)}.lg small{display:block;color:var(--mu);font-size:var(--fs-xs)}
.hl{display:flex;gap:10px;padding:9px 2px;border-bottom:1px dashed var(--line);font-size:var(--fs-sm)}.hl:last-child{border:0}.hl i{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:var(--ok)}.hl i.warn{background:var(--ac)}.hl i.bad{background:var(--bad)}.hl b{display:block}.hl small{display:block;color:var(--mu);font-size:var(--fs-xs);margin-top:2px}
.rc{direction:ltr;text-align:center;font-family:ui-monospace,monospace;font-size:var(--fs-sm);line-height:1.9;background:var(--bg);border:1px dashed var(--ac);border-radius:12px;padding:10px;margin:8px 0;user-select:all}
.au-day{position:sticky;top:0;z-index:1;background:var(--s1);color:var(--mu);font-size:var(--fs-xs);font-weight:700;padding:8px 2px 6px;border-bottom:1px solid var(--line)}
.au{display:flex;gap:10px;padding:10px 2px;border-bottom:1px dashed var(--line)}.au:last-child{border:0}
.au-ic{flex:none;width:32px;height:32px;border-radius:10px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:var(--fs-md)}
.au-bd{flex:1;min-width:0}.au-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.au-top b{font-size:var(--fs-sm)}
.au-top .pos{color:var(--ok);white-space:nowrap}.au-top .neg{color:var(--bad);white-space:nowrap}
.au-sub{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;color:var(--mu);font-size:var(--fs-xs);margin-top:3px}
.au-tg{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:0 7px;color:var(--tx);font-weight:600}
.au-dt{margin-top:4px;font-size:var(--fs-sm);color:var(--tx);opacity:.85;word-break:break-word}
.au-bar{display:flex;gap:8px;margin:2px 0 6px}.au-bar input{flex:1}
.toast{position:fixed;inset:auto 16px calc(100px + env(safe-area-inset-bottom)) 16px;z-index:9;margin:auto;max-width:420px;background:var(--s2);border:1px solid var(--line);
  border-radius:14px;padding:11px 14px;text-align:center;box-shadow:var(--shadow)}
.toast.bad{border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}
  main>*{animation:fade .28s ease-out both}@keyframes fade{from{transform:translateY(6px);opacity:0}}
  main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}
}


/* ───────── حالت دسکتاپ (PC): خودکار روی صفحه‌ی عریض، یا با دکمه‌ی 🖥/📱 بالای صفحه ───────── */
html.desk{--fs-xs:12.5px;--fs-sm:13.5px;--fs-md:15px;--fs-lg:17px;--fs-xl:24px;--fs-2xl:32px;--fs-3xl:38px}   /* مقیاس تایپوگرافی دسکتاپ */
html.desk body{padding-bottom:36px;padding-inline-start:116px}
html.desk header h1{font-size:var(--fs-lg)}
html.desk .card h2,html.desk .sec h2{font-size:var(--fs-md)}
html.desk header{padding-inline:28px}
html.desk main{max-width:1040px;padding:22px 24px 30px}
html.desk nav{inset:auto;top:76px;inset-inline-start:14px;bottom:auto;width:92px;max-width:none;margin:0;grid-template-columns:1fr;gap:4px;border-radius:20px}
html.desk nav button{padding:12px 4px 10px;font-size:var(--fs-sm);line-height:1.45;white-space:nowrap;gap:5px}
html.desk nav button:hover{background:var(--s2);color:var(--tx)}
html.desk nav button.on::after{bottom:3px}
html.desk .toast{inset:auto 16px 28px 16px}
html.desk .card{padding:20px}
html.desk .stat{grid-template-columns:repeat(4,1fr)}
html.desk .stat div.wide{grid-column:1/-1}
html.desk .tiles{grid-template-columns:repeat(6,1fr)}
html.desk .hero .mini{grid-template-columns:repeat(6,1fr)}
html.desk .btn{width:auto;min-width:140px}
html.desk .btns .btn{flex:0 1 auto}
html.desk .row>*,html.desk .cols>div{min-width:0}
html.desk .item>summary,html.desk .item>.head{padding:14px 18px}
html.desk .item .body{padding:0 18px 18px}
html.desk .drawer{width:340px}
html.desk .scrim.on{cursor:pointer}
html.desk img.qr{width:260px}
html.desk .item:hover{border-color:#4a6479}
html.desk body:has(nav[hidden]){padding-inline-start:0}
.deskbtn{display:none}
@media (min-width:900px){.deskbtn{display:inline-block}}

[hidden]{display:none!important}
.tag{display:inline-block;font-style:normal;font-size:var(--fs-xs);font-weight:700;padding:1px 8px;border-radius:99px;margin-inline-start:8px;border:1px solid var(--line);color:var(--mu);white-space:nowrap;vertical-align:middle;line-height:1.6}
.tag.t-active{color:var(--ok);border-color:#3ecf8e55;background:#3ecf8e14}
.tag.t-on_hold{color:var(--warn);border-color:color-mix(in srgb,var(--ac) 53%,transparent);background:color-mix(in srgb,var(--ac) 17%,transparent)}
.tag.t-expired,.tag.t-limited{color:var(--bad);border-color:#f2706b55;background:#f2706b14}
.item.s-active{border-inline-start:3px solid var(--ok)}.item.s-on_hold{border-inline-start:4px solid var(--warn);background:linear-gradient(90deg,color-mix(in srgb,var(--ac) 6%,transparent),transparent 60%)}
.pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:14px 0 6px}
.pager button{min-width:38px;height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--s1);color:var(--mu);font:inherit;font-size:var(--fs-sm);font-weight:700;cursor:pointer}
.pager button.on{color:var(--ac-ink);background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.pager button:disabled{opacity:.4;cursor:default}.pager span{color:var(--mu)}
.sbox{position:relative;margin-bottom:10px}
.sbox input{padding-right:44px}

input[type=search]::-webkit-search-cancel-button{display:none}

(function () {
  var root = document.documentElement, KEY = 'rb_view';
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function auto() { return window.innerWidth >= 1024 ? 'desk' : 'mob'; }
  function apply() {
    var m = saved() || auto();
    root.classList.toggle('desk', m === 'desk');
    var b = document.getElementById('deskbtn');
    if (b) b.textContent = m === 'desk' ? '📱 موبایل' : '🖥 دسکتاپ';
  }
  apply();
  var b = document.getElementById('deskbtn');
  if (b) b.onclick = function () { save(root.classList.contains('desk') ? 'mob' : 'desk'); apply(); };
  window.addEventListener('resize', function () { if (!saved()) apply(); });
})();

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'value') n.value = v;
    else if (k === 'checked') n.checked = !!v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
// عملیات مالی: برای هر درخواست یک کلید یکتا فرستاده می‌شود. اگر شبکه قطع شد و کاربر دوباره زد، همان کلید دوباره می‌رود
// و سرور پول را دوباره کم نمی‌کند. بعد از گرفتن هر پاسخ (موفق یا خطا) کلید پاک می‌شود تا خرید بعدی مستقل باشد.
const _idem = {};
const _moneyPath = /^\/(rep\/(buy|renew|topup|next-plan)|reps\/[^/?]+\/wallet)(\?|$)/;
function _newKey() { try { return crypto.randomUUID().replace(/-/g, ''); } catch { return Date.now().toString(36) + Math.random().toString(36).slice(2, 12); } }
async function api(path, method = 'GET', body) {
  let r;
  const money = method === 'POST' && _moneyPath.test(path);
  const slot = money ? path.split('?')[0] + '|' + JSON.stringify(body || {}) : '';
  if (S.panel && !/^\/(state|templates|panels|qr)/.test(path) && path !== '/settings') path += (path.includes('?') ? '&' : '?') + 'panel=' + encodeURIComponent(S.panel);
  const headers = { 'Content-Type': 'application/json', 'X-Requested-With': 'rebecca' };
  if (money) headers['Idempotency-Key'] = _idem[slot] || (_idem[slot] = _newKey());
  try {
    r = await fetch('/api' + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  } catch { throw new Error('ارتباط با سرور برقرار نشد؛ اگر مطمئن نیستید عملیات انجام شده، قبل از تلاش دوباره «کاربران من/تراکنش‌ها» را ببینید.'); }
  if (money) delete _idem[slot];
  if (r.status === 401) { location.href = '/login'; throw new Error('نشست شما تمام شد؛ دوباره وارد شوید.'); }
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) { const er = new Error(typeof d.detail === 'string' ? d.detail : (Array.isArray(d.detail) ? 'ورودی نامعتبر است.' : 'خطا ' + r.status)); er.needCode = r.headers.get('X-Need-Code') === '1'; throw er; }
  return d;
}
// عملیات حساس (مبلغ بالا، بازیابی بکاپ…) وقتی ورود دومرحله‌ای روشن است کد تازه می‌خواهد؛ هر کد فقط یک‌بار قابل استفاده است.
async function withCode(fn) {
  try { return await fn(''); }
  catch (e) {
    if (!e.needCode) throw e;
    const c = (prompt(e.message + '\n\nکد ۶ رقمی اپلیکیشن (یا یک کد بازیابی) را وارد کنید:') || '').trim();
    if (!c) throw new Error('لغو شد.');
    return await fn(c);
  }
}
let tt;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const a = h('textarea', { value: text, style: 'position:fixed;opacity:0' }); document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); }

<script>
(function(){var T=[["violet","🟣 بنفش"],["light","☀️ روشن"],["ocean","🌊 اقیانوس"],["emerald","🌿 زمرد"],["rose","🌸 رز"],["sunset","🟠 کهربایی"]];
function apply(t){var r=document.documentElement;if(t==="violet")delete r.dataset.theme;else r.dataset.theme=t;
 var m=document.querySelector('meta[name=color-scheme]');if(m)m.content=t==="light"?"light":"dark"}
var cur="violet";try{cur=localStorage.getItem("rb-theme")||"violet"}catch(e){}apply(cur);
var s=document.getElementById("themesel");if(!s)return;
T.forEach(function(x){var o=document.createElement("option");o.value=x[0];o.textContent=x[1];if(x[0]===cur)o.selected=true;s.appendChild(o)});
s.onchange=function(){apply(s.value);try{localStorage.setItem("rb-theme",s.value)}catch(e){}}})();
(function(){var r=document.documentElement,b=document.getElementById("skinbtn");if(!b)return;
function refresh(){try{if(typeof renderNav==="function")renderNav()}catch(e){}b.title=r.dataset.skin==="aura"?"پوسته: اورا ← کلاسیک":"پوسته: کلاسیک ← اورا"}
b.onclick=function(){var on=r.dataset.skin==="aura";if(on)delete r.dataset.skin;else r.dataset.skin="aura";try{localStorage.setItem("rb-skin",on?"classic":"aura")}catch(e){}refresh()};
refresh()})();
</script>
