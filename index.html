<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>پنل ربکا</title>
<style>
:root{
  --bg:#0a1016;--s1:#121b24;--s2:#1a2632;--line:#233241;--tx:#e9f0f6;--mu:#8497aa;
  --ac:#f0b429;--ac2:#ff8a3d;--ac-ink:#1c1503;--ok:#3ecf8e;--bad:#f2706b;--warn:#f5a524;--info:#5aa9ff;--r:16px;
  --shadow:0 8px 28px #0007;
  font-family:"Vazirmatn","Vazir","IRANSansX","Segoe UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 420px at 90% -140px,#f0b4291f,transparent 60%),radial-gradient(700px 380px at -10% 8%,#5aa9ff12,transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--tx);font-size:14px;line-height:1.7;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:16px;color:var(--ac-ink);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 14px #f0b42955}
.pill{font-size:11px;padding:3px 11px;border-radius:99px;background:var(--s2);color:var(--mu);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#3ecf8e55;background:#3ecf8e14}.pill.bad{color:var(--bad);border-color:#f2706b55;background:#f2706b14}
main{max-width:600px;margin:0 auto;padding:14px 14px 24px}
nav{position:fixed;inset:auto 10px calc(10px + env(safe-area-inset-bottom)) 10px;z-index:6;max-width:580px;margin:0 auto;background:color-mix(in srgb,var(--s1) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px}
nav button{position:relative;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;font-weight:600;padding:7px 0 6px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s,background .15s}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
nav button.on{color:var(--ac);background:linear-gradient(180deg,#f0b4292b,#f0b42910)}
nav button.on svg{transform:translateY(-1px) scale(1.08)}
nav button.on::after{content:"";position:absolute;bottom:2px;width:16px;height:3px;border-radius:3px;background:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:linear-gradient(180deg,var(--s1),#0f1821);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0004}
.card h2{font-size:13px;font-weight:800;margin-bottom:12px;color:var(--tx);display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:15px;border-radius:4px;background:linear-gradient(180deg,var(--ac),var(--ac2));flex:none}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;padding:10px 12px;min-height:46px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px #f0b42926;outline:0}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--ac)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--tx);font-size:13px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--s2);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;width:100%;transition:transform .08s,filter .15s,border-color .15s}
.btn:hover{border-color:#3a5166}.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:var(--ac-ink);box-shadow:0 4px 16px #f0b42940}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad)}.btn.sm{min-height:36px;padding:0 12px;font-size:12px;width:auto}
.btn:disabled{opacity:.5;cursor:wait}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1}
.hint{font-size:12px;color:var(--mu);margin-top:8px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sec h2{font-size:14px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:16px;border-radius:4px;background:linear-gradient(180deg,var(--ac),var(--ac2))}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--s1),#0f1821);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 8px}
.stat div::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--line));opacity:.9}
.stat div::after{content:"";position:absolute;inset-inline-end:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--c,transparent);opacity:.09}
.stat span{font-size:11px;color:var(--mu);white-space:nowrap}
.stat strong{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c,var(--tx));line-height:1.3;unicode-bidi:isolate}
.stat div.wide{grid-column:1/-1;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.stat div.wide strong{font-size:28px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#f0b4292e,#ff8a3d14 55%,transparent),var(--s1);border:1px solid #f0b42947;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset-inline-start:-40px;bottom:-60px;width:160px;height:160px;border-radius:50%;background:var(--ac);opacity:.07}
.hero .lb{font-size:12px;color:var(--mu)}
.hero .big{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.35;unicode-bidi:isolate}
.hero .big small{font-size:12px;color:var(--mu);font-weight:500;margin-inline-start:6px}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;position:relative;z-index:1}
.hero .mini div{background:#0a101699;border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.hero .mini span{display:block;font-size:11px;color:var(--mu)}
.hero .mini strong{font-size:15px;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.bw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.bw div{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--mu)}
.bw b{font-size:16px;font-variant-numeric:tabular-nums;direction:ltr}
.bw .d b{color:var(--info)}.bw .u b{color:var(--ok)}
.item{border:1px solid var(--line);background:linear-gradient(180deg,var(--s1),#0f1821);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.item:hover{border-color:#34495b}
.item>summary,.item>.head{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer;min-height:50px}
.item>summary::-webkit-details-marker{display:none}
.item>summary .nm{flex:1;min-width:0}.item>summary .sub{flex:none}
.item>summary::after{content:"";flex:none;width:7px;height:7px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;margin-inline-start:4px}
.item[open]>summary::after{transform:rotate(-135deg)}
.item[open]{border-color:#3a5166}
.item .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.nm{font-weight:700;word-break:break-all}.sub{font-size:12px;color:var(--mu)}
code,.code{display:block;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:10px 0;word-break:break-all;cursor:copy}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),#7be3b3);transition:width .5s}
.bar i.w{background:linear-gradient(90deg,var(--warn),#ffd079)}.bar i.b{background:linear-gradient(90deg,var(--bad),#ff9d99)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--mu);border-radius:99px;padding:5px 14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.chip:hover{border-color:#3a5166;color:var(--tx)}
.chip.on{color:var(--ac-ink);background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:6px;background:var(--mu)}
.s-active .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}.s-on_hold .dot{background:var(--info)}.s-expired .dot,.s-limited .dot{background:var(--bad)}
img.qr{display:block;margin:10px auto;width:220px;max-width:100%;border-radius:14px;background:#fff;padding:8px}
.err{color:var(--bad);font-size:12px;margin-top:6px}
.toast{position:fixed;inset:auto 16px calc(100px + env(safe-area-inset-bottom)) 16px;z-index:9;margin:auto;max-width:420px;background:var(--s2);border:1px solid var(--line);
  border-radius:14px;padding:11px 14px;text-align:center;box-shadow:var(--shadow)}
.toast.bad{border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}
  main>*{animation:fade .28s ease-out both}@keyframes fade{from{transform:translateY(6px);opacity:0}}
  main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}
}
</style>
</head>
<body>
<header><h1><span class="logo">R</span>پنل مدیریت ربکا</h1><div style="display:flex;gap:8px;align-items:center"><select id="psel" hidden aria-label="پنل فعال" style="min-height:34px;padding:2px 10px;width:auto;max-width:150px;font-size:12px"></select><span id="conn" class="pill">…</span><button id="out" class="pill" type="button" style="cursor:pointer;font:inherit;font-size:11px" aria-label="خروج">خروج</button></div></header>
<main id="view"></main>
<nav id="nav"></nav>
<div id="toast" class="toast" hidden></div>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'value') n.value = v;
    else if (k === 'checked') n.checked = !!v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat(9)) if (c != null && c !== false) n.append(c.nodeType ? c : document.createTextNode(c));
  return n;
}
async function api(path, method = 'GET', body) {
  let r;
  if (S.panel && !/^\/(state|templates|panels|qr)/.test(path) && path !== '/settings') path += (path.includes('?') ? '&' : '?') + 'panel=' + encodeURIComponent(S.panel);
  try {
    r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'rebecca' }, body: body ? JSON.stringify(body) : undefined });
  } catch { throw new Error('ارتباط با سرور برقرار نشد.'); }
  if (r.status === 401) { location.href = '/login'; throw new Error('نشست شما تمام شد؛ دوباره وارد شوید.'); }
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : (Array.isArray(d.detail) ? 'ورودی نامعتبر است.' : 'خطا ' + r.status));
  return d;
}
let tt;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.className = 'toast' + (bad ? ' bad' : ''); t.hidden = false;
  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch { const a = h('textarea', { value: text, style: 'position:fixed;opacity:0' }); document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('کپی شد');
}
const gb = b => !b ? 'نامحدود' : (b / 1073741824).toFixed(2) + ' GB';
function toggleQR(box, sub, name) {
  if (box.firstChild) return box.replaceChildren();
  box.replaceChildren(h('img', { class: 'qr', loading: 'lazy', alt: 'QR ' + name, src: '/api/qr?text=' + encodeURIComponent(sub) }));
}
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
async function run(btn, fn) {
  const old = btn.textContent; btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; btn.textContent = old; }
}

const S = { st: null, panel: null, tab: 'create', users: { q: '', status: '', off: 0 }, last: null };
const ICONS = {   // آیکون‌های خطی (ثابت و داخلی)
  create: '<path d="M12 5v14M5 12h14"/>',
  users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-5.5 6-5.5s6 2.2 6 5.5"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.8c1.8.7 3 2.4 3 5.2"/>',
  home: '<path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  tpl: '<rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="10" height="6" rx="2"/><path d="M18 14v6M15 17h6"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>'
};
const svgIcon = k => { const w = document.createElement('span'); w.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`; return w.firstChild; };
const TABS = [['create', 'create', 'ساخت'], ['users', 'users', 'کاربران'], ['home', 'home', 'خانه'], ['tpl', 'tpl', 'تمپلت'], ['set', 'set', 'تنظیمات']];

function renderNav() {
  const nav = $('#nav'); nav.replaceChildren(...TABS.map(([k, ic, t]) =>
    h('button', { class: S.tab === k ? 'on' : '', onclick: () => go(k), 'aria-label': t }, svgIcon(ic), t)));
}
async function go(tab) { S.tab = tab; renderNav(); await ({ create: vCreate, users: vUsers, home: vHome, tpl: vTpl, set: vSet })[tab](); window.scrollTo(0, 0); }
const hasPanel = () => S.st.panels.some(p => p.ok);
async function refreshState() {
  S.st = await api('/state');
  let saved = null; try { saved = localStorage.getItem('rb.panel'); } catch {}
  if (!S.st.panels.some(p => p.id === S.panel)) S.panel = S.st.panels.some(p => p.id === saved) ? saved : S.st.active_panel;
  const sel = $('#psel'); sel.hidden = S.st.panels.length < 2;
  sel.replaceChildren(...S.st.panels.map(p => h('option', { value: p.id, selected: p.id === S.panel }, p.name)));
  sel.onchange = () => setPanel(sel.value);
  const cur = S.st.panels.find(p => p.id === S.panel), c = $('#conn');
  c.textContent = !S.st.panels.length ? 'پنل ندارید' : (cur && cur.ok ? 'متصل' : 'ناقص'); c.className = 'pill ' + (cur && cur.ok ? 'ok' : 'bad');
}
async function setPanel(id) {
  S.panel = id; S.users.off = 0; try { localStorage.setItem('rb.panel', id); } catch {}
  $('#psel').value = id; await go(S.tab);
}
$('#out').onclick = async () => { try { await fetch('/api/logout', { method: 'POST', headers: { 'X-Requested-With': 'rebecca' } }); } catch {} location.href = '/login'; };
const mount = (...n) => $('#view').replaceChildren(...n);
const field = (label, input) => h('div', {}, h('label', {}, label), input);

/* ───────── ساخت ───────── */
async function vCreate() {
  const st = S.st;
  if (!hasPanel()) return mount(h('div', { class: 'card' }, h('h2', {}, 'اتصال به پنل'), h('p', { class: 'hint' }, 'ابتدا از تب «تنظیمات» یک پنل ربکا اضافه کنید.'), h('div', { class: 'btns' }, h('button', { class: 'btn pri', onclick: () => go('set') }, 'رفتن به تنظیمات'))));
  let services = [];
  try { services = (await api('/services')).services; } catch (e) { toast(e.message, true); }
  const psel = h('select', {}, st.panels.map(p => h('option', { value: p.id, selected: p.id === S.panel }, p.name + (p.ok ? '' : ' (ناقص)'))));
  psel.onchange = () => setPanel(psel.value);
  const tpl = h('select', {});
  const kindOf = m => m === 'group' ? 'group' : 'single';
  const fillTplOpts = m => {                                   // فقط تمپلت‌های همین نوع (اگر نبود همه)
    const k = kindOf(m); let ents = Object.entries(st.templates).filter(([, t]) => (t.kind || 'single') === k); if (!ents.length) ents = Object.entries(st.templates);
    const def = k === 'group' ? st.active_group : st.active;
    tpl.replaceChildren(...ents.map(([n, t]) => h('option', { value: n, selected: n === def }, `${n} — ${t.gb || '∞'}GB / ${t.days || '∞'}d`)));
    if (!ents.some(([n]) => n === def) && tpl.options.length) tpl.selectedIndex = 0;
  };
  fillTplOpts('single');
  const ltr = { autocapitalize: 'none', autocomplete: 'off', dir: 'ltr', maxlength: 32 };
  const base = h('input', { ...ltr, value: st.default_prefix, placeholder: 'MS_' });
  const start = h('input', { type: 'number', inputmode: 'numeric', min: 0, dir: 'ltr', placeholder: '…' });
  const count = h('input', { type: 'number', inputmode: 'numeric', min: 1, max: st.max_batch, value: 1, dir: 'ltr' });
  const one = h('input', { ...ltr, placeholder: 'MS_150' });             // حالت تکی: نام کامل
  const cg = h('input', { type: 'number', min: 0, step: 'any', dir: 'ltr', placeholder: 'GB (0=∞)' });
  const cd = h('input', { type: 'number', min: 0, dir: 'ltr', placeholder: 'روز (0=∞)' });
  const cm = h('select', {}, h('option', { value: 'on_hold' }, '⏳ از اولین اتصال (On-Hold)'), h('option', { value: 'active' }, '▶️ از همین حالا (Active)'));
  const fillTpl = () => { const t = st.templates[tpl.value]; if (t) { cg.value = t.gb; cd.value = t.days; cm.value = t.mode; } };
  tpl.addEventListener('change', fillTpl);
  const svc = h('select', {}, services.map(s => h('option', { value: s.id }, s.name)));
  // تکی ← ms ، گروهی ← hamkari (اگر کاربر دستی عوض کند، دیگر خودکار تغییر نمی‌کند)
  const hamNames = (st.ham_names && st.ham_names.length ? st.ham_names : ['hamkari']).map(x => x.toLowerCase());
  const isHam = s => hamNames.some(n => n && s.name.toLowerCase().includes(n));
  const autoSvc = m => {
    const c = m === 'group' ? services.find(isHam) : (services.find(s => !isHam(s) && s.name.trim().toLowerCase() === 'ms') || services.find(s => !isHam(s) && /(^|[^a-z0-9])ms([^a-z0-9]|$)/i.test(s.name)));
    if (c) svc.value = c.id;
  };
  let svcTouched = false; svc.addEventListener('change', () => { svcTouched = true; });
  const tg = h('input', { type: 'checkbox', id: 'tg', checked: st.bot });
  const prev = h('p', { class: 'hint' }), last = h('p', { class: 'hint' });
  const out = h('div');
  let mode = 'single';   // هر بار که صفحه باز می‌شود، پیش‌فرض ساخت تکی است
  const chipS = h('button', { class: 'chip', type: 'button' }, '👤 تکی'), chipG = h('button', { class: 'chip', type: 'button' }, '👥 گروهی');
  const grpBox = h('div', {}, field('پیشوند نام کاربری', base), h('div', { class: 'row' }, field('عدد شروع (خودکار)', start), field('تعداد', count)));
  const oneBox = h('div', {}, field('نام کاربری', one));

        h('p', { class: 'sub' }, (x.match ? '⭐ هم‌دامنه با پنل · ' : '') + x.source + (x.cn ? ' · ' + x.cn : '') + (x.expires ? ' · تا ' + x.expires : '')),
        h('code', { style: 'margin:6px 0' }, x.cert), h('code', { style: 'margin:6px 0' }, x.key),
        x.ok ? h('button', { class: 'btn sm pri', type: 'button', onclick: () => { crt.value = x.cert; key.value = x.key; if (x.cn && !dom.value) dom.value = x.cn.replace(/^\*\./, ''); on.checked = true; toast('مسیرها پر شد؛ «ذخیره و اعمال» را بزنید'); } }, 'استفاده از این گواهی') : h('p', { class: 'err' }, '❌ ' + x.error)))));
    });
    const saveSsl = h('button', { class: 'btn pri', type: 'button' }, 'ذخیره و اعمال (ریستارت وب‌پنل)');
    saveSsl.onclick = () => run(saveSsl, async () => {
      if (!confirm(on.checked ? 'وب‌پنل با SSL ریستارت می‌شود و آدرس جدید باز می‌شود. ادامه؟' : 'تنظیمات ذخیره و وب‌پنل ریستارت شود؟')) return;
      const r = await api('/ssl', 'POST', { enabled: on.checked, cert: crt.value, key: key.value, domain: dom.value, port: +prt.value || 8686 });
      if (!r.restart) { toast('ذخیره شد (تغییری برای ریستارت نبود)'); return; }
      toast('✅ ذخیره شد؛ در حال ریستارت… به آدرس جدید می‌روید'); const same = new URL(r.url).protocol === location.protocol;
      const go = () => { location.href = r.url; };
      if (!same) return setTimeout(go, 4500);
      for (let n = 0; n < 15; n++) { await new Promise(x => setTimeout(x, 1500)); try { await fetch(r.url + '/login', { mode: 'no-cors', cache: 'no-store' }); break; } catch {} }
      go();
    });
    sslCard = h('div', { class: 'card' }, h('h2', {}, '🔒 SSL و پورت وب‌پنل'),
      h('p', { class: 'hint', style: 'margin:0 0 6px' }, state + exp),
      sc2.error ? h('p', { class: 'err' }, 'آخرین خطا: ' + sc2.error) : null,
      h('label', { class: 'chk', for: 'sslOn' }, on, 'وب‌پنل با HTTPS اجرا شود'),
      field('دامنه (همان دامنه پنل ربکا)', dom), field('مسیر گواهی (cert / fullchain)', crt), field('مسیر کلید خصوصی (key)', key), field('پورت وب‌پنل', prt),
      h('div', { class: 'btns' }, detB), found,
      h('div', { class: 'btns' }, saveSsl),
      h('p', { class: 'hint' }, 'پنل ربکا باید روی همین سرور باشد تا فایل‌های گواهی‌اش خوانده شود. بعد از تمدید گواهی، وب‌پنل خودش ریستارت می‌شود. اگر بعد از تغییر به آدرس نرسیدید، روی سرور بزنید: rebecca-bot ssl off'));
  } catch (e) { sslCard = h('div', { class: 'card' }, h('h2', {}, '🔒 SSL و پورت وب‌پنل'), h('p', { class: 'err' }, e.message)); }
  // بکاپ و بازیابی
  const autoB = h('input', { type: 'checkbox', id: 'autob', checked: c.backup_enabled });
  autoB.onchange = () => api('/backup/settings', 'POST', { enabled: autoB.checked }).then(() => toast(autoB.checked ? 'بکاپ شبانه روشن شد' : 'بکاپ شبانه خاموش شد')).catch(e => { autoB.checked = !autoB.checked; toast(e.message, true); });
  const dlB = h('button', { class: 'btn', type: 'button' }, '⬇️ دانلود بکاپ'); dlB.onclick = () => { location.href = '/api/backup'; };
  const tgB = h('button', { class: 'btn', type: 'button' }, '📤 ارسال بکاپ به تلگرام'); tgB.onclick = () => run(tgB, async () => { await api('/backup/send', 'POST'); toast('✅ بکاپ به تلگرام ارسال شد'); });
  const fileI = h('input', { type: 'file', accept: '.json,application/json' });
  const rsB = h('button', { class: 'btn bad', type: 'button' }, '♻️ بازیابی از فایل');
  rsB.onclick = () => run(rsB, async () => {
    const f = fileI.files[0]; if (!f) throw new Error('ابتدا فایل بکاپ را انتخاب کنید.');
    if (f.size > 2e6) throw new Error('حجم فایل زیاد است.');
    if (!confirm('همه‌ی تنظیمات فعلی (پنل‌ها، توکن، قیمت‌ها، دیتابیس) با این فایل جایگزین شود؟\nاز وضعیت فعلی یک نسخه‌ی پشتیبان روی سرور ذخیره می‌شود.')) return;
    const r = await api('/backup/restore', 'POST', { content: await f.text() });
    toast(`✅ بازیابی شد (${r.panels} پنل) · ربات در حال ریستارت`);
    setTimeout(() => location.reload(), r.web_changed ? 1800 : 1200);
  });
  const backupCard = h('div', { class: 'card' }, h('h2', {}, '💾 بکاپ و بازیابی'),
    h('label', { class: 'chk', for: 'autob' }, autoB, 'ارسال خودکار بکاپ هر شب ساعت ۰۰:۰۰ همراه گزارش فروش'),
    h('div', { class: 'btns' }, dlB, tgB),
    h('h2', { style: 'font-size:13px;margin:14px 0 6px' }, 'بازیابی از فایل بکاپ'), fileI,
    h('p', { class: 'hint' }, 'فایل بکاپ شامل توکن و رمزهاست. بعد از بازیابی ربات خودکار ریستارت می‌شود. اگر رمز وب‌پنل در فایل متفاوت باشد، باید با رمز آن فایل دوباره وارد شوید.'),
    h('div', { class: 'btns' }, rsB));
  mount(
    sslCard, priceCard, backupCard,
    h('h2', { style: 'font-size:13px;margin:0 2px 8px' }, `پنل‌های ربکا (${c.panels.length})`), ...list,
    h('div', { class: 'card' }, ptitle, field('نام پنل', nm), field('آدرس پنل', url), field('دامنه سابسکریپشن', sub), field('نام کاربری ادمین', user), field('رمز عبور', pass),
      h('label', { class: 'chk', for: 'ssl' }, ssl, 'بررسی گواهی SSL (برای گواهی خودامضا خاموش بماند)'),
      h('div', { class: 'btns' }, saveP, h('button', { class: 'btn', onclick: () => fill(null) }, 'فرم خالی (پنل جدید)'))),
    h('div', { class: 'card' }, h('h2', {}, 'ربات تلگرام'), field('توکن ربات', tok), field('شناسه ادمین‌ها', adm), h('p', { class: 'hint' }, 'شناسه عددی را از ربات‌هایی مثل @userinfobot بگیرید.'), h('div', { class: 'btns' }, saveB)),
    h('div', { class: 'card' }, h('h2', {}, `رمز وب‌پنل (کاربر: ${c.web_user})`), field('رمز جدید', wp), h('div', { class: 'btns' }, saveW)));
}

(async () => {
  renderNav();
  try { await refreshState(); await go(hasPanel() ? 'create' : 'set'); }
  catch (e) { mount(h('div', { class: 'card' }, h('p', { class: 'err' }, e.message))); }
})();
</script>
</body>
</html>
