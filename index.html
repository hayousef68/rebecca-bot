<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>پنل </title>
<style>
:root{
  --bg:#0a1016;--s1:#121b24;--s2:#1a2632;--line:#233241;--tx:#e9f0f6;--mu:#8497aa;
  --ac:#f0b429;--ac2:#ff8a3d;--ac-ink:#1c1503;--ok:#3ecf8e;--bad:#f2706b;--warn:#f5a524;--info:#5aa9ff;--r:16px;
  --shadow:0 8px 28px #0007;
  font-family:"Vazirmatn","Vazir","IRANSansX","Segoe UI",Tahoma,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(900px 420px at 90% -140px,#f0b4291f,transparent 60%),radial-gradient(700px 380px at -10% 8%,#5aa9ff12,transparent 60%),var(--bg);
  background-attachment:fixed;color:var(--tx);font-size:14px;line-height:1.7;padding-bottom:calc(100px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;font-size:16px;color:var(--ac-ink);background:linear-gradient(135deg,var(--ac),var(--ac2));box-shadow:0 4px 14px #f0b42955}
.pill{font-size:11px;padding:3px 11px;border-radius:99px;background:var(--s2);color:var(--mu);border:1px solid var(--line)}
.pill.ok{color:var(--ok);border-color:#3ecf8e55;background:#3ecf8e14}.pill.bad{color:var(--bad);border-color:#f2706b55;background:#f2706b14}
main{max-width:600px;margin:0 auto;padding:14px 14px 24px}
nav{position:fixed;inset:auto 10px calc(10px + env(safe-area-inset-bottom)) 10px;z-index:6;max-width:580px;margin:0 auto;background:color-mix(in srgb,var(--s1) 88%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);
  display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px}
nav button{position:relative;background:none;border:0;color:var(--mu);font:inherit;font-size:11px;font-weight:600;padding:7px 0 6px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .15s,background .15s}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
nav button.on{color:var(--ac);background:linear-gradient(180deg,#f0b4292b,#f0b42910)}
nav button.on svg{transform:translateY(-1px) scale(1.08)}
nav button.on::after{content:"";position:absolute;bottom:2px;width:16px;height:3px;border-radius:3px;background:var(--ac)}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.card{background:linear-gradient(180deg,var(--s1),#0f1821);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px;box-shadow:0 2px 10px #0004}
.card h2{font-size:13px;font-weight:800;margin-bottom:12px;color:var(--tx);display:flex;align-items:center;gap:8px}
.card h2::before{content:"";width:4px;height:15px;border-radius:4px;background:linear-gradient(180deg,var(--ac),var(--ac2));flex:none}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 4px}
input,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--tx);font:inherit;padding:10px 12px;min-height:46px;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus{border-color:var(--ac);box-shadow:0 0 0 3px #f0b42926;outline:0}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--ac)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--tx);font-size:13px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);
  background:var(--s2);color:var(--tx);font:inherit;font-weight:700;cursor:pointer;width:100%;transition:transform .08s,filter .15s,border-color .15s}
.btn:hover{border-color:#3a5166}.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent;color:var(--ac-ink);box-shadow:0 4px 16px #f0b42940}
.btn.pri:hover{filter:brightness(1.07)}
.btn.bad{color:var(--bad)}.btn.sm{min-height:36px;padding:0 12px;font-size:12px;width:auto}
.btn:disabled{opacity:.5;cursor:wait}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.btns .btn{flex:1;white-space:nowrap}
.hint{font-size:12px;color:var(--mu);margin-top:8px}
.sec{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 10px}
.sec h2{font-size:14px;font-weight:800;margin:0;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:16px;border-radius:4px;background:linear-gradient(180deg,var(--ac),var(--ac2))}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat div{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--s1),#0f1821);border:1px solid var(--line);border-radius:var(--r);padding:10px 10px 8px}
.stat div::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--c,var(--line));opacity:.9}
.stat div::after{content:"";position:absolute;inset-inline-end:-18px;top:-18px;width:64px;height:64px;border-radius:50%;background:var(--c,transparent);opacity:.09}
.stat span{font-size:11px;color:var(--mu);white-space:nowrap}
.stat strong{display:block;font-size:21px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c,var(--tx));line-height:1.3;unicode-bidi:isolate}
.stat div.wide{grid-column:1/-1;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}
.stat div.wide strong{font-size:28px}
.hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#f0b4292e,#ff8a3d14 55%,transparent),var(--s1);border:1px solid #f0b42947;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.hero::after{content:"";position:absolute;inset-inline-start:-40px;bottom:-60px;width:160px;height:160px;border-radius:50%;background:var(--ac);opacity:.07}
.hero .lb{font-size:12px;color:var(--mu)}
.hero .big{font-size:32px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.35;unicode-bidi:isolate}
.hero .big small{font-size:12px;color:var(--mu);font-weight:500;margin-inline-start:6px}
.hero .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;position:relative;z-index:1}
.hero .mini div{background:#0a101699;border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center}
.hero .mini span{display:block;font-size:11px;color:var(--mu)}
.hero .mini strong{font-size:15px;font-variant-numeric:tabular-nums;unicode-bidi:isolate}
.bw{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
.bw div{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--mu)}
.bw b{font-size:16px;font-variant-numeric:tabular-nums;direction:ltr}
.bw .d b{color:var(--info)}.bw .u b{color:var(--ok)}
.item{border:1px solid var(--line);background:linear-gradient(180deg,var(--s1),#0f1821);border-radius:var(--r);margin-bottom:8px;overflow:hidden;transition:border-color .15s}
.item:hover{border-color:#34495b}
.item>summary,.item>.head{list-style:none;padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:center;cursor:pointer;min-height:50px}
.item>summary::-webkit-details-marker{display:none}
.item>summary .nm{flex:1;min-width:0}.item>summary .sub{flex:none}
.item>summary::after{content:"";flex:none;width:7px;height:7px;border:solid var(--mu);border-width:0 2px 2px 0;transform:rotate(45deg);transition:transform .2s;margin-inline-start:4px}
.item[open]>summary::after{transform:rotate(-135deg)}
.item[open]{border-color:#3a5166}
.item .body{padding:0 14px 14px;border-top:1px solid var(--line)}
.nm{font-weight:700;word-break:break-all}.sub{font-size:12px;color:var(--mu)}
code,.code{display:block;direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--bg);
  border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:10px 0;word-break:break-all;cursor:copy}
.bar{height:8px;background:var(--bg);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--ok),#7be3b3);transition:width .5s}
.bar i.w{background:linear-gradient(90deg,var(--warn),#ffd079)}.bar i.b{background:linear-gradient(90deg,var(--bad),#ff9d99)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--s1);color:var(--mu);border-radius:99px;padding:5px 14px;font:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
.chip:hover{border-color:#3a5166;color:var(--tx)}
.chip.on{color:var(--ac-ink);background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-inline-end:6px;background:var(--mu)}
.s-active .dot{background:var(--ok);box-shadow:0 0 8px var(--ok)}.s-on_hold .dot{background:var(--warn)}.s-expired .dot,.s-limited .dot{background:var(--bad)}
.rnote{display:block;font-size:12px;color:var(--ac);margin-top:2px;word-break:break-word}
.tag.paid{color:var(--ok);border-color:#3ecf8e55;background:#3ecf8e14}.paidchk{margin:8px 0 0;font-size:13px}
.notebox{display:flex;gap:6px;margin:10px 0 0}.notebox .noteIn{flex:1;min-width:0}
.shareapps{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}.shareapps .btn{text-align:center;text-decoration:none}
img.qr{display:block;margin:10px auto;width:220px;max-width:100%;border-radius:14px;background:#fff;padding:8px}
.err{color:var(--bad);font-size:12px;margin-top:6px}
.menubtn{background:none;border:1px solid var(--line);color:var(--tx);border-radius:12px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.menubtn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.scrim{position:fixed;inset:0;background:#000a;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;width:min(300px,84vw);z-index:21;background:linear-gradient(180deg,var(--s1),#0c141c);border-inline-end:1px solid var(--line);box-shadow:var(--shadow);
  transform:translateX(105%);transition:transform .25s;padding:calc(18px + env(safe-area-inset-top)) 14px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;overflow:auto}
.drawer.on{transform:none}
.drawer .who{font-weight:800;font-size:14px}.drawer .bal{margin:10px 0 8px;padding:12px;border-radius:14px;border:1px solid #f0b42955;background:#f0b4291a}
.drawer .bal span{display:block;font-size:11px;color:var(--mu)}.drawer .bal b{font-size:20px;color:var(--ac)}
.drawer .mi{display:flex;align-items:center;gap:10px;width:100%;text-align:start;background:none;border:0;color:var(--tx);font:inherit;font-size:14px;font-weight:600;padding:12px;border-radius:12px;cursor:pointer}
.drawer .mi:hover,.drawer .mi.on{background:var(--s2)}.drawer .mi.on{color:var(--ac)}.drawer .sp{flex:1}
.bigbal{text-align:center;padding:18px 12px}.bigbal span{font-size:12px;color:var(--mu)}.bigbal b{display:block;font-size:28px;color:var(--ac);margin-top:2px}
.tplopt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;background:var(--bg)}
.tplopt.on{border-color:var(--ac);background:#f0b4291a}.tplopt input{width:auto;min-height:0}.tplopt .tn{flex:1;min-width:0;font-weight:700}.tplopt .tp{font-size:12px;color:var(--mu)}.tplopt b{color:var(--ac);white-space:nowrap}
.lg{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:12.5px}.lg:last-child{border:0}.lg .pos{color:var(--ok)}.lg .neg{color:var(--bad)}.lg small{display:block;color:var(--mu);font-size:11px}
.toast{position:fixed;inset:auto 16px calc(100px + env(safe-area-inset-bottom)) 16px;z-index:9;margin:auto;max-width:420px;background:var(--s2);border:1px solid var(--line);
  border-radius:14px;padding:11px 14px;text-align:center;box-shadow:var(--shadow)}
.toast.bad{border-color:var(--bad);color:var(--bad)}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:up .18s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}
  main>*{animation:fade .28s ease-out both}@keyframes fade{from{transform:translateY(6px);opacity:0}}
  main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}
}


/* ───────── حالت دسکتاپ (PC): خودکار روی صفحه‌ی عریض، یا با دکمه‌ی 🖥/📱 بالای صفحه ───────── */
html.desk body{padding-bottom:36px;padding-inline-start:104px;font-size:14.5px}
html.desk header{padding-inline:28px}
html.desk main{max-width:1040px;padding:22px 24px 30px}
html.desk nav{inset:auto;top:76px;inset-inline-start:14px;bottom:auto;width:80px;max-width:none;margin:0;grid-template-columns:1fr;gap:4px;border-radius:20px}
html.desk nav button{padding:11px 0 9px;font-size:12px}
html.desk nav button:hover{background:var(--s2);color:var(--tx)}
html.desk nav button.on::after{bottom:3px}
html.desk .toast{inset:auto 16px 28px 16px}
html.desk .card{padding:20px}
html.desk .stat{grid-template-columns:repeat(4,1fr)}
html.desk .stat div.wide{grid-column:1/-1}
html.desk .tiles{grid-template-columns:repeat(6,1fr)}
html.desk .hero .mini{grid-template-columns:repeat(6,1fr)}
html.desk .btn{width:auto;min-width:140px}
html.desk .btns .btn{flex:0 1 auto}
html.desk .row>*,html.desk .cols>div{min-width:0}
html.desk .item>summary,html.desk .item>.head{padding:14px 18px}
html.desk .item .body{padding:0 18px 18px}
html.desk .drawer{width:340px}
html.desk .scrim.on{cursor:pointer}
html.desk img.qr{width:260px}
html.desk .item:hover{border-color:#4a6479}
html.desk body:has(nav[hidden]){padding-inline-start:0}
.deskbtn{display:none}
@media (min-width:900px){.deskbtn{display:inline-block}}

[hidden]{display:none!important}
.tag{display:inline-block;font-style:normal;font-size:10.5px;font-weight:700;padding:1px 8px;border-radius:99px;margin-inline-start:8px;border:1px solid var(--line);color:var(--mu);white-space:nowrap;vertical-align:middle;line-height:1.6}
.tag.t-active{color:var(--ok);border-color:#3ecf8e55;background:#3ecf8e14}
.tag.t-on_hold{color:var(--warn);border-color:#f0b42988;background:#f0b4292b}
.tag.t-expired,.tag.t-limited{color:var(--bad);border-color:#f2706b55;background:#f2706b14}
.item.s-active{border-inline-start:3px solid var(--ok)}.item.s-on_hold{border-inline-start:4px solid var(--warn);background:linear-gradient(90deg,#f0b4290f,transparent 60%)}
.pager{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:14px 0 6px}
.pager button{min-width:38px;height:36px;padding:0 12px;border-radius:11px;border:1px solid var(--line);background:var(--s1);color:var(--mu);font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.pager button.on{color:var(--ac-ink);background:linear-gradient(135deg,var(--ac),var(--ac2));border-color:transparent}
.pager button:disabled{opacity:.4;cursor:default}.pager span{color:var(--mu)}
.sbox{position:relative;margin-bottom:10px}
.sbox input{padding-right:44px}
.sbox .clr{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:var(--s2);color:var(--mu);font-size:13px;cursor:pointer}
input[type=search]::-webkit-search-cancel-button{display:none}
mark{background:#f0b42940;color:var(--ac);border-radius:4px;padding:0 2px}
.chips.wrap{flex-wrap:wrap;overflow:visible;padding:2px 0 8px}
.ustat{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.unpaid-box{margin:10px 0 0;padding:10px 12px;border:1px solid #f0b42988;background:#f0b4291f;border-radius:12px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:12.5px;color:var(--warn)}
.unpaid-opt{margin-top:8px;padding:8px 10px;border:1px dashed #f0b42966;border-radius:12px}.unpaid-opt .uh{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px;color:var(--mu)}.unpaid-opt .uh input{max-width:90px}
.tag.t-unpaid,em.tag.unp{color:var(--warn)}
.badge{font-size:11px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--s2);color:var(--mu);border:1px solid var(--line)}
.badge.s-active{color:var(--ok);border-color:#3ecf8e55;background:#3ecf8e14}.badge.s-on_hold{color:var(--warn);border-color:#f0b42988;background:#f0b4292b}
.badge.s-expired,.badge.s-limited{color:var(--bad);border-color:#f2706b55;background:#f2706b14}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 6px}
.tiles div{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 6px;text-align:center;min-width:0}
.tiles span{display:block;font-size:11px;color:var(--mu)}.tiles b{display:block;font-size:12.5px;font-weight:700;overflow-wrap:anywhere}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px;margin:14px 0 12px}
.seg button{border:0;background:none;color:var(--mu);font:inherit;font-size:12px;font-weight:700;padding:9px 2px;border-radius:11px;cursor:pointer;transition:all .15s;white-space:nowrap}
.seg button.on{background:linear-gradient(135deg,var(--ac),var(--ac2));color:var(--ac-ink)}
.seg.sm{margin:0 0 10px}.seg.sm button{padding:7px 2px}
.pane{animation:fade .2s ease-out both}
.psec{display:flex;justify-content:space-between;align-items:baseline;margin:14px 0 6px;font-size:12px;color:var(--mu)}.psec b{color:var(--tx)}
.prev{background:var(--bg);border:1px dashed #3a5166;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:13px;line-height:1.9}
.diff{background:var(--bg);border:1px dashed #3a5166;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.9;margin-bottom:4px}
.diff b{color:var(--ac)}
.banner{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:13px}
.banner.ok{border-color:#3ecf8e55;background:#3ecf8e12;color:var(--ok)}
.btn:disabled{filter:grayscale(.6)}

/* فشرده‌سازی فرم‌های داخل کاربر */
.item input,.item select{min-height:38px;padding:5px 10px;font-size:13px;border-radius:10px}
.item .btn{min-height:40px;font-size:13px}.item .btn.sm{min-height:36px}
.item label{margin:8px 0 3px;font-size:11.5px}
.item .chip{padding:2px 10px;font-size:11.5px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cols>div{min-width:0}
.chips.tight{gap:4px;padding:5px 0 4px;flex-wrap:wrap;overflow:visible}
.attach{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}.attach .btn{width:auto;padding:0 14px}
.item .btns:has(.btn.sm){gap:6px}
.plan{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:7px 10px;margin-bottom:6px}
.plan .n{width:22px;height:22px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:11px;color:var(--mu);flex:none}
.plan .v{flex:1;font-weight:700;font-size:13px}.plan .v small{font-weight:400;color:var(--mu);font-size:11px}
.plan .x.fix{background:#f5a5241a;color:var(--warn)}

.ev{display:flex;gap:8px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:6px}
.ev.off{opacity:.55}.ev.off .evi b{text-decoration:line-through}.ev .evi{flex:1;min-width:0;font-size:13px;line-height:1.7}
.ev .x{border:0;background:var(--s2);color:var(--tx);width:32px;height:32px;border-radius:9px;cursor:pointer;flex:none}.ev .x.d{background:#f2706b1a;color:var(--bad)}

.tech{margin-top:10px}.tech summary{font-size:11.5px;color:var(--mu);cursor:pointer}.tech code{font-size:11px;margin:6px 0 0;white-space:pre-wrap}

.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:2px}.acts .btn{width:100%;padding:0 4px;white-space:nowrap}
.chips.tight .chip{padding:1px 9px;font-size:11px}
.chips.tight{flex-wrap:nowrap;gap:3px}

/* کشوهای تنظیمات */
.acc>summary{min-height:56px}
.acc>summary .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--s2);font-size:17px;flex:none}
.acc>summary .nm{font-size:14px;margin-inline-start:2px}
.acc[open]>summary .ic{background:linear-gradient(135deg,var(--ac),var(--ac2))}
.acc-body{padding-top:12px!important}
.acc-in{display:block}.acc-in>:first-child{margin-top:0}
.acc-body .card{box-shadow:none;background:var(--bg)}

.item textarea{width:100%;min-height:70px;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;font-size:13px;padding:8px 10px;resize:vertical;margin-top:2px}

.item.s-disabled .nm{opacity:.6}

<script>
(function () {
  var root = document.documentElement, KEY = 'rb_view';
  function saved() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }
  function save(v) { try { localStorage.setItem(KEY, v); } catch (e) {} }
  function auto() { return window.innerWidth >= 1024 ? 'desk' : 'mob'; }
  function apply() {
    var m = saved() || auto();
    root.classList.toggle('desk', m === 'desk');
    var b = document.getElementById('deskbtn');
    if (b) b.textContent = m === 'desk' ? '📱 موبایل' : '🖥 دسکتاپ';
  }
  apply();
  var b = document.getElementById('deskbtn');
  if (b) b.onclick = function () { save(root.classList.contains('desk') ? 'mob' : 'desk'); apply(); };
  window.addEventListener('resize', function () { if (!saved()) apply(); });
})();
</script>

<script>

    else if (k === 'value') n.value = v;
    else if (k === 'checked') n.checked = !!v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);

}

  try {
    r = await fetch('/api' + path, { method, headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'rebecca' }, body: body ? JSON.stringify(body) : undefined });
  } catch { throw new Error('ارتباط با سرور برقرار نشد.'); }
  if (r.status === 401) { location.href = '/login'; throw new Error('نشست شما تمام شد؛ دوباره وارد شوید.'); }
  let d = {}; try { d = await r.json(); } catch {}
  if (!r.ok) throw new Error(typeof d.detail === 'string' ? d.detail : (Array.isArray(d.detail) ? 'ورودی نامعتبر است.' : 'خطا ' + r.status));

}
let tt;

  clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 3200);
}

  catch { const a = h('textarea', { value: text, style: 'position:fixed;opacity:0' }); document.body.append(a); a.select(); document.execCommand('copy'); a.remove(); }
  toast('کپی شد');
}
const mv = el => +String(el.value).replace(/[\u06F0-\u06F9\u0660-\u0669]/g, d => d.charCodeAt(0) & 15).replace(/[^\d]/g, '') || 0;      // مقدار عددیِ ورودی مبلغ (کامای سه‌رقمی حذف می‌شود)
const moneyIn = (v, ph, extra = {}) => { const el = h('input', { type: 'text', inputmode: 'numeric', dir: 'ltr', autocomplete: 'off', placeholder: ph || 'مبلغ (تومان)', ...extra });
  const fmt = () => { const n = mv(el); el.value = n ? n.toLocaleString('en-US') : ''; };
  el.addEventListener('input', fmt); if (v) { el.value = v; fmt(); } return el; };                                                              // نمایش 1,000,000 هنگام تایپ

const gb = b => !b ? 'نامحدود' : '\u2066' + (b / 1073741824).toFixed(2) + ' GB\u2069';

}
const debounce = (f, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => f(...a), ms); }; };
async function run(btn, fn) {
  const old = btn.textContent; btn.disabled = true;
  try { await fn(); } catch (e) { toast(e.message, true); } finally { btn.disabled = false; btn.textContent = old; }
}

const S = { st: null, panel: null, tab: 'create', users: { q: '', status: '', off: 0 }, last: null };

  home: '<path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/>',
  tpl: '<rect x="4" y="4" width="16" height="6" rx="2"/><rect x="4" y="14" width="10" height="6" rx="2"/><path d="M18 14v6M15 17h6"/>',
  set: '<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M18.4 5.6l-1.8 1.8M7.4 16.6l-1.8 1.8"/>'
};
const svgIcon = k => { const w = document.createElement('span'); w.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]}</svg>`; return w.firstChild; };
const TABS = [['create', 'create', 'ساخت'], ['users', 'users', 'کاربران'], ['home', 'home', 'خانه'], ['tpl', 'tpl', 'تمپلت'], ['set', 'set', 'تنظیمات']];

}
async function go(tab) { S.tab = tab; renderNav(); await ({ create: vCreate, users: vUsers, home: vHome, tpl: vTpl, set: vSet })[tab](); window.scrollTo(0, 0); }
const hasPanel = () => S.st.panels.some(p => p.ok);
async function refreshState() {

  $('#psel').value = id; await go(S.tab);
}
$('#out').onclick = async () => { try { await fetch('/api/logout', { method: 'POST', headers: { 'X-Requested-With': 'rebecca' } }); } catch {} location.href = '/login'; };
const mount = (...n) => $('#view').replaceChildren(...n);
const field = (label, input) => h('div', {}, h('label', {}, label), input);

/* ───────── ساخت ───────── */
async function vCreate() {

  let services = [];

  const psel = h('select', {}, st.panels.map(p => h('option', { value: p.id, selected: p.id === S.panel }, p.name + (p.ok ? '' : ' (ناقص)'))));
  psel.onchange = () => setPanel(psel.value);
  const tpl = h('select', {});
  const kindOf = m => m === 'group' ? 'group' : 'single';

  const count = h('input', { type: 'number', inputmode: 'numeric', min: 1, max: st.max_batch, value: 1, dir: 'ltr' });
  const one = h('input', { ...ltr, placeholder: 'MS_150' });             // حالت تکی: نام کامل

  const prev = h('p', { class: 'hint' }), last = h('p', { class: 'hint' });

  // تشخیص خودکار آخرین نام‌کاربری و شماره‌ی بعدی

function showResults(box, r) {

const faDigits = s => String(s).replace(/[۰-۹]/g, c => '۰۱۲۳۴۵۶۷۸۹'.indexOf(c)).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c));
const normQ = s => faDigits(s).replace(/^[@\s]+/, '').trim().replace(/\s+/g, ' ');   // اعداد فارسی→انگلیسی، حذف @ و فاصله‌های اضافه
const STATUS_FA = { active: 'فعال شده', on_hold: '⏳ خام · هنوز وصل نشده', expired: 'منقضی', limited: 'حجم تمام', disabled: 'غیرفعال' };
const PAGE = 30;                                                                                  // تعداد کاربر در هر صفحه
const TAG_FA = { active: 'فعال شده', on_hold: '⏳ خام · وصل نشده', expired: 'منقضی', limited: 'حجم تمام', disabled: 'غیرفعال' };
const fmtLeftT = ts => { const m = Math.max(0, Math.round((ts * 1000 - Date.now()) / 60000)); return m >= 1440 ? `${Math.floor(m / 1440)} روز و ${Math.floor(m % 1440 / 60)} ساعت` : m >= 60 ? `${Math.floor(m / 60)} ساعت و ${m % 60} دقیقه` : `${m} دقیقه`; };
const stTag = st => h('em', { class: 'tag t-' + st }, TAG_FA[st] || st);                           // برچسب کوچک کنار نام: «خام» یا «فعال شده»
function drawPager(box, total, off, go) {                                                         // صفحه‌بندی شماره‌دار
  const pages = Math.ceil(total / PAGE), cur = Math.floor(off / PAGE) + 1;
  box.replaceChildren(); box.hidden = pages <= 1; if (pages <= 1) return;
  const b = (t, p, on) => h('button', { type: 'button', class: on ? 'on' : '', disabled: p < 1 || p > pages || on, onclick: () => go((p - 1) * PAGE) }, t);
  const nums = [...new Set([1, cur - 1, cur, cur + 1, pages].filter(p => p >= 1 && p <= pages))].sort((x, y) => x - y);
  box.append(b('قبلی', cur - 1));
  nums.forEach((p, i) => { if (i && p - nums[i - 1] > 1) box.append(h('span', {}, '…')); box.append(b(String(p), p, p === cur)); });
  box.append(b('بعدی', cur + 1));
}
const gbr = b => !b ? '∞' : (b / 1073741824).toFixed(2) + ' GB';
const usage = u => '\u2066' + gbr(u.used) + ' / ' + gbr(u.limit) + '\u2069';   // «مصرف / کل» همیشه چپ‌به‌راست

async function vUsers() {
  if (!hasPanel()) return vCreate();
  const U = S.users; let seq = 0;
  const list = h('div'), pg = h('div', { class: 'pager', hidden: true }), info = h('p', { class: 'hint' });
  const search = h('input', { type: 'search', placeholder: 'جستجو: نام کاربری (مثلاً MS_150 یا 150)…', value: U.q, autocomplete: 'off', autocapitalize: 'off', enterkeyhint: 'search' });
  const clear = h('button', { class: 'clr', type: 'button', 'aria-label': 'پاک کردن', hidden: !U.q }, '✕');
  const chips = h('div', { class: 'chips' }, [['', 'همه'], ['active', 'فعال شده'], ['on_hold', 'خام'], ['expired', 'منقضی'], ['limited', 'محدود'], ['disabled', 'غیرفعال'], ['unlimited', '♾ حجم/زمان نامحدود']].map(([k, t]) =>
    h('button', { class: 'chip' + (U.status === k ? ' on' : ''), onclick: () => { U.status = k; vUsers(); } }, t)));
  async function load(reset) {
    const my = ++seq;                                           // جلوگیری از نمایش نتیجه‌ی قدیمی وقتی سریع تایپ می‌کنید
    if (reset) U.off = 0;
    list.style.opacity = .45; info.className = 'hint'; info.textContent = 'در حال بارگذاری…';
    try {
      const r = await api(`/users?offset=${U.off}&limit=${PAGE}&search=${encodeURIComponent(U.q)}&status=${U.status}`);
      if (my !== seq) return;
      if (!r.users.length && r.total && U.off >= r.total) { U.off = (Math.ceil(r.total / PAGE) - 1) * PAGE; return load(false); }   // صفحه‌ی آخر خالی شد (حذف کاربر)
      list.replaceChildren();
      r.users.forEach(u => list.append(userItem(u, list)));
      drawPager(pg, r.total, U.off, o => { U.off = o; load(false); window.scrollTo({ top: 0, behavior: 'smooth' }); });
      const pages = Math.ceil(r.total / PAGE), cur = Math.floor(U.off / PAGE) + 1;
      info.className = 'hint';

    } catch (e) { if (my !== seq) return; info.textContent = e.message; info.className = 'err'; }

  search.addEventListener('input', debounce(apply, 300));
  search.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); apply(); search.blur(); } });
  clear.onclick = () => { search.value = ''; U.q = ''; clear.hidden = true; load(true); search.focus(); };
  try { S.svcs = (await api('/services')).services; } catch { S.svcs = []; }

}

      h('p', { class: 'hint' }, 'در فرم «ساخت اکانت» همین اسم از قبل پر می‌شود و شماره‌ی بعدی خودکار پیدا می‌شود. فقط حرف انگلیسی، عدد و _ (مثلاً MS_).'), h('div', { class: 'btns' }, saveDp)))),
    drawer('unpaid', '💸', 'تمدید واریز نشده', `${c.unpaid_hours} ساعت${c.unpaid_count ? ` · ${c.unpaid_count} در انتظار` : ''}`, strip(h('div', { class: 'card' }, h('h2', {}, 'تمدید واریز نشده'), field('مهلت پیش‌فرض تا غیرفعال‌سازی خودکار (ساعت)', upHrs),
      h('p', { class: 'hint' }, 'موقع تمدید گزینه‌ی «واریز نشده» را بزنید؛ اگر تا پایان مهلت «✅ واریز شد» نزنید، کاربر خودکار غیرفعال می‌شود (چک هر ۱ دقیقه توسط ربات، و پیام به ادمین‌ها). مهلت را موقع هر تمدید هم می‌توانید جداگانه تغییر دهید.'), h('div', { class: 'btns' }, saveUp)))),
    drawer('reps', '👤', 'نماینده‌ها', reps.length ? `${reps.length} نماینده${topups.length ? ' · 💰' + topups.length + ' درخواست' : ''}${reps.some(r => r.blocked) ? ' · ⛔' : ''}` : 'ندارید', repBody),
    drawer('price', '💰', 'قیمت‌ها و فروش', 'لیست · هزینه', strip(priceCard)),
    drawer('backup', '💾', 'بکاپ و بازیابی', c.backup_enabled ? 'خودکار روشن · ' + ((IV.find(x => x[0] === c.backup_interval) || [0, 'روزانه'])[1]) : 'خودکار خاموش', strip(backupCard)),
    drawer('ssl', '🔒', 'SSL و پورت وب‌پنل', sslSub, strip(sslCard)),
    drawer('pw', '🔑', 'رمز وب‌پنل', `کاربر: ${c.web_user}`, strip(h('div', { class: 'card' }, h('h2', {}, `رمز وب‌پنل (کاربر: ${c.web_user})`), field('رمز جدید', wp), h('div', { class: 'btns' }, saveW)))));
}

(async () => {
  let me; try { me = await api('/me'); } catch { return; }
  if (me.role === 'rep') return repApp(me);
  renderNav();
  try { await refreshState(); await go(hasPanel() ? 'create' : 'set'); }
  catch (e) { mount(h('div', { class: 'card' }, h('p', { class: 'err' }, e.message))); }
})();
</script>
</body>
</html>
