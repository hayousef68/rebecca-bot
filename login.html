<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="robots" content="noindex,nofollow">
<title>ورود | پنل ربکا</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<script>try{var t=localStorage.getItem("rb-theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root {
  --bg: #090d16; --s0: #0d1320; --s1: #111827; --s2: #1e293b;
  --line: #263349; --tx: #f1f5f9; --mu: #94a3b8; --fg: #fff;
  --ac: #6366f1; --ac2: #22d3ee; --ac-ink: #ffffff;
  --bad: #f43f5e; --ok: #10b981;
  --font: "Vazirmatn", "Vazir", "IRANSansX", "Segoe UI", Tahoma, system-ui, sans-serif;
  --fs-xs: 11.5px; --fs-sm: 13px; --fs-md: 14px; --fs-lg: 16px; --fs-xl: 21px;
  font-family: var(--font);
}
html[data-theme=light] {
  --bg: #f1f5f9; --s0: #f8fafc; --s1: #ffffff; --s2: #e2e8f0;
  --line: #cbd5e1; --tx: #0f172a; --mu: #64748b; --fg: #000;
  --ac: #4f46e5; --ac2: #0284c7; --ac-ink: #ffffff; color-scheme: light;
}
html[data-theme=ocean] { --bg: #041016; --s0: #071720; --s1: #0b212d; --s2: #123142; --line: #1b4359; --ac: #06b6d4; --ac2: #3b82f6; --ac-ink: #021218; }
html[data-theme=emerald] { --bg: #05110d; --s0: #081813; --s1: #0c221b; --s2: #13352a; --line: #1c4739; --ac: #10b981; --ac2: #84cc16; --ac-ink: #03150e; }
html[data-theme=rose] { --bg: #13080e; --s0: #190b13; --s1: #22101b; --s2: #331829; --line: #472239; --ac: #f43f5e; --ac2: #a855f7; --ac-ink: #ffffff; }
html[data-theme=sunset] { --bg: #110c06; --s0: #181109; --s1: #22180d; --s2: #332414; --line: #47321c; --ac: #f59e0b; --ac2: #ea580c; --ac-ink: #180f03; }

button, input, select, textarea { font-family: inherit; }
* { box-sizing: border-box; margin: 0; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
  color: var(--tx); font-size: var(--fs-md); line-height: 1.7;
  background-color: var(--bg);
  background-image: radial-gradient(ellipse 80% 45% at 50% -10%, color-mix(in srgb, var(--ac) 18%, transparent), transparent);
  overflow-x: hidden;
}
.orb { display: none; }
.wrap { position: relative; z-index: 1; width: 100%; max-width: 400px; }
.brand { text-align: center; margin-bottom: 22px; }
.logo {
  width: 64px; height: 64px; border-radius: 20px; margin: 0 auto 14px;
  display: grid; place-items: center; font-size: 32px; font-weight: 800; color: var(--ac-ink);
  background: linear-gradient(135deg, var(--ac), var(--ac2));
  box-shadow: 0 8px 26px color-mix(in srgb, var(--ac) 28%, transparent);
}
.brand h1 { font-size: var(--fs-xl); font-weight: 800; }
.brand p { color: var(--mu); font-size: var(--fs-sm); margin-top: 2px; }
.card {
  background: var(--s1); border: 1px solid var(--line); border-radius: 20px;
  padding: 24px 20px 20px; box-shadow: 0 12px 36px rgba(0, 0, 0, 0.35);
}
.f { position: relative; margin-bottom: 14px; }
.f label { display: block; font-size: var(--fs-sm); color: var(--mu); margin: 0 2px 6px; }
.f .ic { position: absolute; inset-inline-start: 14px; bottom: 14px; width: 20px; height: 20px; stroke: var(--mu); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; transition: stroke .15s; }
.f:focus-within .ic { stroke: var(--ac); }
input[type=text], input[type=password] {
  width: 100%; min-height: 48px; background: var(--s0); border: 1px solid var(--line); border-radius: 12px;
  color: var(--tx); font: inherit; font-size: var(--fs-md); padding: 10px 44px; direction: ltr; text-align: left;
  transition: border-color .15s, box-shadow .15s;
}
input:focus { border-color: var(--ac); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ac) 20%, transparent); outline: 0; }
.eye { position: absolute; inset-inline-end: 6px; bottom: 5px; width: 38px; height: 38px; border: 0; background: none; border-radius: 10px; cursor: pointer; display: grid; place-items: center; color: var(--mu); }
.eye:hover { color: var(--tx); background: var(--s2); }
.eye svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.opts { display: flex; align-items: center; justify-content: space-between; margin: 2px 2px 16px; font-size: var(--fs-sm); color: var(--mu); }
.chk { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
.chk input { width: 18px; height: 18px; accent-color: var(--ac); cursor: pointer; }
.btn {
  width: 100%; min-height: 48px; border: 0; border-radius: 12px; font: inherit; font-size: var(--fs-md); font-weight: 800;
  cursor: pointer; color: var(--ac-ink); background: linear-gradient(135deg, var(--ac), var(--ac2));
  box-shadow: 0 6px 20px color-mix(in srgb, var(--ac) 25%, transparent); display: flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .08s, filter .15s, opacity .15s;
}
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .7; cursor: wait; }
.spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid rgba(255,255,255,.3); border-top-color: var(--ac-ink); animation: r .7s linear infinite; display: none; }
.btn.load .spin { display: block; }
@keyframes r { to { transform: rotate(360deg); } }
.err { display: none; align-items: center; gap: 8px; background: color-mix(in srgb, var(--bad) 12%, transparent); border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent); color: var(--bad); border-radius: 12px; padding: 9px 12px; font-size: var(--fs-sm); margin-bottom: 14px; }
.err.show { display: flex; }
.err svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 2; }
.card.shake { animation: sh .35s; }
@keyframes sh { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.foot { text-align: center; color: var(--mu); font-size: var(--fs-sm); margin-top: 16px; display: flex; align-items: center; justify-content: center; gap: 6px; }
.foot svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; }
.foot.ok { color: var(--ok); }
.pill { background: var(--s1); color: var(--tx); border: 1px solid var(--line); }
.themesel { cursor: pointer; font: inherit; font-size: var(--fs-xs); padding: 5px 10px; border-radius: 10px; }
</style>
</head>
<body>
<div class="orb a"></div><div class="orb b"></div>
<main class="wrap">
  <div class="brand">
    <div class="logo">R</div>
    <h1>پنل مدیریت ربکا</h1>
    <p>برای ادامه وارد شوید</p>
  </div>
  <form class="card" id="card" autocomplete="on" novalidate>
    <div class="err" id="err" role="alert"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16.2v.1"/></svg><span id="errt"></span></div>
    <div class="f">
      <label for="u">نام کاربری</label>
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-3.6 3.4-6 7.5-6s7.5 2.4 7.5 6"/></svg>
      <input id="u" name="username" type="text" inputmode="text" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="username" required autofocus>
    </div>
    <div class="f">
      <label for="p">رمز عبور</label>
      <svg class="ic" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>
      <input id="p" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required>
      <button type="button" class="eye" id="eye" aria-label="نمایش رمز">
        <svg viewBox="0 0 24 24" id="eyei"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></svg>
      </button>
    </div>
    <div class="f" id="codeBox" hidden>
      <label for="c">کد ورود دومرحله‌ای</label>
      <input id="c" name="otp" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="کد ۶ رقمی اپلیکیشن" dir="ltr" maxlength="20">
      <p style="margin:8px 2px 0;font-size:var(--fs-sm);color:var(--mu)">کد ۶ رقمی را از اپلیکیشن Google Authenticator (یا مشابه) وارد کنید. اگر گوشی را ندارید، یکی از کدهای بازیابی (مثل <span dir="ltr">ab12cd-34ef56</span>) را بزنید.</p>
    </div>
    <div class="opts" id="optsBox">
      <label class="chk"><input type="checkbox" id="rem"> مرا ۳۰ روز به خاطر بسپار</label>
    </div>
    <button class="btn" id="go" type="submit"><span class="spin"></span><span id="gt">ورود به پنل</span></button>
  </form>
  <div class="foot" id="foot"></div>
</main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const card = $('#card'), err = $('#err'), btn = $('#go'), u = $('#u'), p = $('#p'), cbox = $('#codeBox'), cin = $('#c');
let pre = '';
const OPEN = '<path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/>';
const SHUT = '<path d="M3 3l18 18M10.6 5.7A9.6 9.6 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a16 16 0 0 1-3.2 3.9M6.4 6.9C3.8 8.7 2.5 12 2.5 12S6 18.5 12 18.5c1.6 0 3-.4 4.3-1M9.9 9.9a3 3 0 0 0 4.2 4.2"/>';
$('#eye').onclick = () => { const show = p.type === 'password'; p.type = show ? 'text' : 'password'; $('#eyei').innerHTML = show ? SHUT : OPEN; p.focus(); };
if (location.protocol === 'https:') { const f = $('#foot'); f.classList.add('ok'); f.innerHTML = '<svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>اتصال امن (HTTPS)'; }
function fail(msg) {
  $('#errt').textContent = msg; err.classList.add('show');
  card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
}
[u, p, cin].forEach(x => x.addEventListener('input', () => err.classList.remove('show')));
function askCode() {
  document.querySelectorAll('#card .f').forEach(f => { if (f.id !== 'codeBox') f.hidden = true; });
  $('#optsBox').hidden = true; cbox.hidden = false; $('#gt').textContent = 'تأیید و ورود'; cin.value = ''; cin.focus();
}
card.addEventListener('submit', async e => {
  e.preventDefault();
  const step2 = !!pre;
  if (!step2 && (!u.value.trim() || !p.value)) return fail('نام کاربری و رمز عبور را وارد کنید.');
  if (step2 && !cin.value.trim()) return fail('کد را وارد کنید.');
  btn.disabled = true; btn.classList.add('load'); $('#gt').textContent = 'در حال ورود…';
  try {
    const r = step2
      ? await fetch('/api/login/2fa', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'rebecca' }, body: JSON.stringify({ pre, code: cin.value.trim() }) })
      : await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'rebecca' }, body: JSON.stringify({ user: u.value.trim(), password: p.value, remember: $('#rem').checked }) });
    let d = {}; try { d = await r.json(); } catch {}
    if (r.ok && d.need_code) { pre = d.pre; p.value = ''; btn.disabled = false; btn.classList.remove('load'); askCode(); return; }
    if (r.ok) { $('#gt').textContent = 'ورود موفق ✓'; location.replace('/'); return; }
    fail(typeof d.detail === 'string' ? d.detail : 'ورود ناموفق بود.');
    if (step2) { if (r.status === 401 && /زمان/.test(d.detail || '')) location.reload(); cin.select(); } else p.select();
  } catch { fail('ارتباط با سرور برقرار نشد.'); }
  btn.disabled = false; btn.classList.remove('load'); $('#gt').textContent = pre ? 'تأیید و ورود' : 'ورود به پنل';
});
</script>
<select id="themesel" class="pill themesel" aria-label="قالب" style="position:fixed;top:12px;inset-inline-start:12px"></select>
<script>
(function(){var T=[["violet","🟣 بنفش"],["light","☀️ روشن"],["ocean","🌊 اقیانوس"],["emerald","🌿 زمرد"],["rose","🌸 رز"],["sunset","🟠 کهربایی"]];
function apply(t){var r=document.documentElement;if(t==="violet")delete r.dataset.theme;else r.dataset.theme=t;
 var m=document.querySelector('meta[name=color-scheme]');if(m)m.content=t==="light"?"light":"dark"}
var cur="violet";try{cur=localStorage.getItem("rb-theme")||"violet"}catch(e){}apply(cur);
var s=document.getElementById("themesel");if(!s)return;
T.forEach(function(x){var o=document.createElement("option");o.value=x[0];o.textContent=x[1];if(x[0]===cur)o.selected=true;s.appendChild(o)});
s.onchange=function(){apply(s.value);try{localStorage.setItem("rb-theme",s.value)}catch(e){}}})();
</script>
</body>
</html>
